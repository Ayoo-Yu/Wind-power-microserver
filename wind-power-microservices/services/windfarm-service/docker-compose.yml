version: '3.8'

services:
  # PostgreSQL Database
  windfarm-db:
    image: postgres:15-alpine
    container_name: windfarm-db
    environment:
      POSTGRES_DB: windfarm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - windfarm_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - windfarm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  windfarm-redis:
    image: redis:7-alpine
    container_name: windfarm-redis
    command: redis-server --appendonly yes
    volumes:
      - windfarm_redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - windfarm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Wind Farm Management Service
  windfarm-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windfarm-service
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@windfarm-db:5432/windfarm_db
      - REDIS_URL=redis://windfarm-redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here-change-in-production}
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    volumes:
      - ./src:/app/src
    ports:
      - "8001:8001"
    depends_on:
      windfarm-db:
        condition: service_healthy
      windfarm-redis:
        condition: service_healthy
    networks:
      - windfarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Database Admin (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: windfarm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@windpower.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - windfarm-db
    networks:
      - windfarm-network
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # Redis Admin (Redis Commander)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: windfarm-redis-commander
    environment:
      - REDIS_HOSTS=local:windfarm-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - windfarm-redis
    networks:
      - windfarm-network

networks:
  windfarm-network:
    driver: bridge

volumes:
  windfarm_db_data:
  windfarm_redis_data:
  pgadmin_data: