version: '3.8'

services:
  tenant-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windpower-tenant-service
    ports:
      - "8001:8001"
    environment:
      - TENANT_SERVICE_ENVIRONMENT=development
      - TENANT_SERVICE_DATABASE_URL=postgresql://windpower:password@postgres:5432/windpower_tenant
      - TENANT_SERVICE_REDIS_URL=redis://redis:6379/1
      - TENANT_SERVICE_SECRET_KEY=your-secret-key-here-make-it-long-and-random
      - TENANT_SERVICE_LOG_LEVEL=INFO
      - TENANT_SERVICE_CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    depends_on:
      - postgres
      - redis
    networks:
      - windpower-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:15-alpine
    container_name: windpower-postgres-tenant
    environment:
      - POSTGRES_DB=windpower_tenant
      - POSTGRES_USER=windpower
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - windpower-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: windpower-redis-tenant
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - windpower-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:

networks:
  windpower-network:
    driver: bridge