version: '3.8'

services:
  # PostgreSQL Database
  power-prediction-postgres:
    image: postgres:15-alpine
    container_name: power-prediction-postgres
    environment:
      POSTGRES_DB: power_prediction_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - power-prediction-postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - power-prediction-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  power-prediction-redis:
    image: redis:7-alpine
    container_name: power-prediction-redis
    ports:
      - "6382:6379"
    volumes:
      - power-prediction-redis-data:/data
    networks:
      - power-prediction-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka
  power-prediction-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: power-prediction-kafka
    depends_on:
      - power-prediction-zookeeper
    ports:
      - "9095:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: power-prediction-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9095
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - power-prediction-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  power-prediction-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: power-prediction-zookeeper
    ports:
      - "2184:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - power-prediction-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Power Prediction Service
  power-prediction-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: power-prediction-service
    depends_on:
      power-prediction-postgres:
        condition: service_healthy
      power-prediction-redis:
        condition: service_healthy
      power-prediction-kafka:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      # Application settings
      APP_NAME: "Power Prediction Service"
      APP_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: "8004"
      DEBUG: "false"

      # Database settings
      DATABASE_URL: "postgresql+asyncpg://postgres:password@power-prediction-postgres:5432/power_prediction_db"

      # Redis settings
      REDIS_URL: "redis://power-prediction-redis:6379"

      # Kafka settings
      KAFKA_BOOTSTRAP_SERVERS: "power-prediction-kafka:9092"
      KAFKA_TOPICS_POWER_PREDICTION: "power-predictions"
      KAFKA_TOPICS_POWER_DATA: "power-data"
      KAFKA_TOPICS_WEATHER_DATA: "weather-data"
      KAFKA_TOPICS_SCADA_DATA: "scada-data"

      # Machine Learning settings
      ML_MODELS_PATH: "/app/models"
      ML_MODEL_UPDATE_INTERVAL: "3600"
      ML_TRAINING_BATCH_SIZE: "1000"
      ML_PREDICTION_HORIZON_HOURS: "72"

      # Model Configuration
      ENABLE_LSTM_MODEL: "true"
      ENABLE_XGBOOST_MODEL: "true"
      ENABLE_RANDOM_FOREST_MODEL: "true"
      ENABLE_ENSEMBLE_MODEL: "true"

      # API Settings
      WEATHER_API_URL: "http://meteorological-service:8003"
      SCADA_API_URL: "http://scada-data-service:8002"
      WIND_FARM_API_URL: "http://wind-farm-service:8001"

      # Security settings
      SECRET_KEY: "your-secret-key-here-change-in-production"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ALGORITHM: "HS256"

      # Monitoring Settings
      PROMETHEUS_METRICS_ENABLED: "true"
      METRICS_PORT: "8000"

      # Logging Settings
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"

      # CORS settings
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://api-gateway:8000"

      # Rate limiting
      RATE_LIMIT_PER_MINUTE: "1000"
      RATE_LIMIT_PER_HOUR: "10000"

      # Data Retention
      PREDICTION_HISTORY_DAYS: "365"
      MODEL_PERFORMANCE_HISTORY_DAYS: "90"

      # Training Settings
      AUTO_RETRAINING_ENABLED: "true"
      RETRAINING_INTERVAL_HOURS: "168"
      MIN_TRAINING_SAMPLES: "10000"

      # Feature Engineering
      ENABLE_FEATURE_ENGINEERING: "true"
      FEATURE_LAG_HOURS: "24"
      FEATURE_ROLLING_WINDOWS: "3,6,12,24"

    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
      - ./config:/app/config
    networks:
      - power-prediction-network
      - microservices-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: power-prediction-kafka-ui
    depends_on:
      - power-prediction-kafka
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: power-prediction-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: power-prediction-kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: power-prediction-zookeeper:2181
    networks:
      - power-prediction-network

volumes:
  power-prediction-postgres-data:
  power-prediction-redis-data:

networks:
  power-prediction-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
  microservices-network:
    external: true