version: '3.8'

services:
  # PostgreSQL Database
  scada-postgres:
    image: postgres:15-alpine
    container_name: scada-postgres
    environment:
      POSTGRES_DB: scada_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - scada-postgres-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - scada-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # InfluxDB Time Series Database
  scada-influxdb:
    image: influxdb:2.7-alpine
    container_name: scada-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ORG: windpower
      DOCKER_INFLUXDB_INIT_BUCKET: scada_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: scada-token
    ports:
      - "8087:8086"
    volumes:
      - scada-influxdb-data:/var/lib/influxdb2
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  scada-redis:
    image: redis:7-alpine
    container_name: scada-redis
    ports:
      - "6380:6379"
    volumes:
      - scada-redis-data:/data
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Apache Kafka
  scada-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: scada-kafka
    depends_on:
      - scada-zookeeper
    ports:
      - "9093:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: scada-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Zookeeper for Kafka
  scada-zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: scada-zookeeper
    ports:
      - "2182:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SCADA Data Service
  scada-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scada-service
    depends_on:
      scada-postgres:
        condition: service_healthy
      scada-influxdb:
        condition: service_healthy
      scada-redis:
        condition: service_healthy
      scada-kafka:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      # Application settings
      APP_NAME: "SCADA Data Service"
      APP_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: "8002"
      DEBUG: "false"

      # Database settings
      DATABASE_URL: "postgresql+asyncpg://postgres:password@scada-postgres:5432/scada_db"

      # InfluxDB settings
      INFLUXDB_URL: "http://scada-influxdb:8086"
      INFLUXDB_TOKEN: "scada-token"
      INFLUXDB_ORG: "windpower"
      INFLUXDB_BUCKET: "scada_data"

      # Redis settings
      REDIS_URL: "redis://scada-redis:6379"

      # Kafka settings
      KAFKA_BOOTSTRAP_SERVERS: "scada-kafka:9092"
      KAFKA_TOPICS_SCADA_REALTIME: "scada-realtime"
      KAFKA_TOPICS_SCADA_ALARMS: "scada-alarms"
      KAFKA_TOPICS_SCADA_EVENTS: "scada-events"

      # Security settings
      SECRET_KEY: "your-secret-key-here-change-in-production"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      ALGORITHM: "HS256"

      # SCADA protocol settings
      IEC104_PORT: "2404"
      MAX_CONNECTIONS_PER_WIND_FARM: "10"
      CONNECTION_TIMEOUT: "30"
      RECONNECT_DELAY: "10"
      MAX_RECONNECT_ATTEMPTS: "5"

      # Rate limiting
      RATE_LIMIT_PER_MINUTE: "1000"
      RATE_LIMIT_PER_HOUR: "10000"

      # CORS settings
      CORS_ORIGINS: "http://localhost:3000,http://localhost:8080"

    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - scada-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Kafka UI for monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: scada-kafka-ui
    depends_on:
      - scada-kafka
    ports:
      - "8089:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: scada-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: scada-kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: scada-zookeeper:2181
    networks:
      - scada-network

volumes:
  scada-postgres-data:
  scada-influxdb-data:
  scada-redis-data:

networks:
  scada-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16