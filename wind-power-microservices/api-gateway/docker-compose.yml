version: '3.8'

services:
  # Kong Database
  kong-db:
    image: postgres:15-alpine
    container_name: wind-farm-kong-db
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    ports:
      - "5433:5432"
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - wind-farm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong Migration (Bootstrap Kong database)
  kong-migration:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wind-farm-kong-migration
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
    networks:
      - wind-farm-network
    restart: "no"

  # Kong API Gateway
  kong:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wind-farm-kong
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migration:
        condition: service_completed_successfully
    ports:
      - "8000:8000"   # Proxy
      - "8443:8443"   # Proxy SSL
      - "8001:8001"   # Admin API
      - "8444:8444"   # Admin API SSL
      - "8002:8002"   # Admin GUI
      - "8445:8445"   # Admin GUI SSL
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_CASSANDRA_CONTACT_POINTS: kong-db
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_GUI_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_GUI_ERROR_LOG: /dev/stderr
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002, 0.0.0.0:8445 ssl
      KONG_NGINX_DAEMON: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PLUGINS: bundled,jwt-crafter,prometheus,rate-limiting,cors,request-transformer,response-transformer
      KONG_TRUSTED_IPS: 0.0.0.0/0,::/0
      KONG_REAL_IP_HEADER: X-Forwarded-For
      KONG_REAL_IP_RECURSIVE: "on"
      KONG_ERROR_DEFAULT_TYPE: json
      KONG_LUA_PACKAGE_PATH: /usr/local/share/lua/5.1/?.lua;;
      KONG_LUA_PACKAGE_CPATH: /usr/local/lib/lua/5.1/?.so;;
    volumes:
      - ./config/kong.conf:/etc/kong/kong.conf
      - ./declarative/kong.yml:/kong/declarative/kong.yml
      - ./plugins/:/usr/local/share/lua/5.1/kong/plugins/
      - kong-logs:/usr/local/kong/logs
    networks:
      - wind-farm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Konga - Kong Admin GUI (Alternative/Additional)
  konga:
    image: pantsel/konga:latest
    container_name: wind-farm-konga
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "1337:1337"
    environment:
      TOKEN_SECRET: wind-farm-konga-secret-key-change-in-production
      NODE_ENV: production
      KONG_ADMIN_URL: http://kong:8001
    networks:
      - wind-farm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for rate limiting and caching
  redis:
    image: redis:7-alpine
    container_name: wind-farm-kong-redis
    ports:
      - "6380:6379"
    volumes:
      - kong-redis-data:/data
    networks:
      - wind-farm-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  kong-db-data:
  kong-redis-data:
  kong-logs:

networks:
  wind-farm-network:
    external: true