# Kong Configuration File

# Database settings
database = postgres
pg_host = kong-db
pg_port = 5432
pg_user = kong
pg_password = kong
pg_database = kong

# Security settings
admin_listen = 0.0.0.0:8001
admin_listen_ssl = 0.0.0.0:8444
proxy_listen = 0.0.0.0:8000, 0.0.0.0:8443 ssl
admin_gui_listen = 0.0.0.0:8002
admin_gui_url = http://localhost:8002

# Logging settings
access_log = /dev/stdout
error_log = /dev/stderr
log_level = info

# Performance settings
nginx_worker_processes = auto
nginx_daemon = off

# Plugin settings
plugins = bundled,jwt-crafter,prometheus,rate-limiting,cors,request-transformer,response-transformer

# Rate limiting settings
rate_limiting_strategy = local
rate_limiting_redis_host = redis
rate_limiting_redis_port = 6379

# CORS settings
cors_origins = http://localhost:3000,http://localhost:8080,http://localhost:8000
cors_methods = GET,POST,PUT,DELETE,OPTIONS
cors_headers = Accept,Accept-Version,Content-Length,Content-MD5,Content-Type,Date,Authorization,Access-Control-Allow-Origin,X-Requested-With

# JWT settings
jwt_secret_is_base64 = false
jwt_key_claim_name = iss

# Prometheus metrics
prometheus_metrics_enabled = true
prometheus_metrics_shared_dict = kong_prometheus_metrics

# Upstream settings
upstream_keepalive = 60
upstream_keepalive_pool_size = 60
upstream_keepalive_max_requests = 100
upstream_keepalive_idle_timeout = 60

# Health checks
health_check_enabled = true
health_check_interval = 30
health_check_timeout = 10

# Request size limits
client_max_body_size = 10m
client_body_buffer_size = 8k

# Timeouts
proxy_connect_timeout = 60s
proxy_send_timeout = 60s
proxy_read_timeout = 60s

# SSL settings (for production)
# ssl_cert = /path/to/cert.pem
# ssl_cert_key = /path/to/cert.key
# ssl_ciphers = ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
# ssl_protocols = TLSv1.2 TLSv1.3