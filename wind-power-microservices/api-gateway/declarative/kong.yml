# Upstreams configuration for load balancing
upstreams:
  - name: meteorological-service-upstream
    algorithm: consistent-hashing
    hash_on: header
    hash_on_header: X-Consumer-ID
    hash_fallback: none
    slots: 1000
    healthchecks:
      active:
        type: http
        timeout: 10
        concurrency: 10
        tcp_failures: 3
        tcp_successes: 2
        http_failures: 3
        http_successes: 2
        tcp: false
        http: true
        https_verify_certificate: true
        https_sni: null
        headers:
          - Host:kong-health-check
        interval: 30
        http_path: /health
        https: false
      passive:
        type: http
        tcp_failures: 3
        tcp_successes: 2
        http_failures: 3
        http_successes: 2
        tcp: false
        http: true
        timeouts: 3
        unhealthy:
          tcp_failures: 3
          http_failures: 3
          timeouts: 3
          http_statuses:
            - 429
            - 500
            - 503
        healthy:
          tcp_successes: 2
          http_successes: 2
          http_statuses:
            - 200
            - 201
            - 202
            - 203
            - 204
            - 205
            - 206
            - 207
            - 208
            - 226
            - 300
            - 301
            - 302
            - 303
            - 304
            - 305
            - 306
            - 307
            - 308
    tags:
      - weather
      - upstream

# Targets for meteorological service
  - name: meteorological-service-targets
    upstream: meteorological-service-upstream
    weight: 100
    tags:
      - weather
      - target

# Similar configurations for other services...
# (SCADA, Power Prediction, Report, Tenant, Wind Farm services)

# Global plugins configuration
plugins:
  # CORS plugin for cross-origin requests
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:8080"
        - "http://localhost:8000"
        - "https://wind-farm-ui.com"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - Access-Control-Allow-Origin
        - X-Requested-With
        - X-Consumer-ID
        - X-Consumer-Username
      exposed_headers:
        - X-Auth-Token
        - X-Consumer-ID
        - X-Consumer-Username
      credentials: true
      max_age: 3600
    enabled: true
    protocols:
      - http
      - https

  # Rate limiting plugin
  - name: rate-limiting
    config:
      minute: 1000
      hour: 10000
      day: 100000
      month: 1000000
      year: 10000000
      limit_by: consumer
      policy: local
      redis_host: redis
      redis_port: 6379
      redis_timeout: 2000
      redis_database: 1
      hide_client_headers: false
      fault_tolerant: true
    enabled: true
    protocols:
      - http
      - https

  # Prometheus metrics plugin
  - name: prometheus
    config:
      per_consumer: true
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true
    enabled: true

  # Request transformer plugin
  - name: request-transformer
    config:
      add:
        headers:
          - "X-Kong-Proxy:true"
          - "X-Kong-Version:3.5.0"
      remove:
        headers:
          - "Authorization"
      replace:
        headers:
          - "X-Forwarded-For:$remote_addr"
    enabled: true

  # Response transformer plugin
  - name: response-transformer
    config:
      add:
        headers:
          - "X-Kong-Response-Time:$request_time"
      remove:
        headers:
          - "Server"
          - "X-Powered-By"
    enabled: true

# Consumers (API clients)
consumers:
  - username: wind-farm-web-ui
    custom_id: wind-farm-web-ui-001
    tags:
      - web-ui
      - frontend

  - username: wind-farm-mobile-app
    custom_id: wind-farm-mobile-app-001
    tags:
      - mobile
      - app

  - username: external-api-client
    custom_id: external-api-client-001
    tags:
      - external
      - api

  - username: admin-client
    custom_id: admin-client-001
    tags:
      - admin
      - management

# JWT credentials for consumers
jwt_secrets:
  - consumer: wind-farm-web-ui
    key: wind-farm-web-ui-key
    secret: wind-farm-web-ui-secret-key-change-in-production
    algorithm: HS256

  - consumer: wind-farm-mobile-app
    key: wind-farm-mobile-app-key
    secret: wind-farm-mobile-app-secret-key-change-in-production
    algorithm: HS256

  - consumer: external-api-client
    key: external-api-client-key
    secret: external-api-client-secret-key-change-in-production
    algorithm: HS256

  - consumer: admin-client
    key: admin-client-key
    secret: admin-client-secret-key-change-in-production
    algorithm: HS256

