version: '3.8'

services:
  # Shared Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: wind-farm-postgres
    environment:
      POSTGRES_DB: windfarm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wind-farm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wind-farm-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - wind-farm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: wind-farm-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - wind-farm-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: wind-farm-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - wind-farm-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: wind-farm-api-gateway
    ports:
      - "8000:8000"
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=postgres
      - KONG_PG_PORT=5432
      - KONG_PG_USER=postgres
      - KONG_PG_PASSWORD=password
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_PROXY_LISTEN=0.0.0.0:8000
      - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wind-farm-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Meteorological Service
  meteorological-service:
    build:
      context: ./services/meteorological-service
      dockerfile: Dockerfile
    container_name: wind-farm-meteorological-service
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - WEATHER_API_KEY=your-weather-api-key
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=your-influxdb-token
      - INFLUXDB_ORG=windfarm
      - INFLUXDB_BUCKET=weather-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # SCADA Service
  scada-service:
    build:
      context: ./services/scada-service
      dockerfile: Dockerfile
    container_name: wind-farm-scada-service
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=your-influxdb-token
      - INFLUXDB_ORG=windfarm
      - INFLUXDB_BUCKET=scada-data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Power Prediction Service
  power-prediction-service:
    build:
      context: ./services/power-prediction-service
      dockerfile: Dockerfile
    container_name: wind-farm-power-prediction-service
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/2
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MODEL_REGISTRY_PATH=/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Report Service
  report-service:
    build:
      context: ./services/report-service
      dockerfile: Dockerfile
    container_name: wind-farm-report-service
    ports:
      - "8004:8004"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/3
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POWER_PREDICTION_API_URL=http://power-prediction-service:8003
      - WEATHER_API_URL=http://meteorological-service:8001
      - SCADA_API_URL=http://scada-service:8002
      - WIND_FARM_API_URL=http://windfarm-service:8006
      - REPORT_TEMPLATES_PATH=/app/templates
      - REPORT_OUTPUT_PATH=/app/reports
      - CHART_CACHE_PATH=/app/charts
    volumes:
      - ./services/report-service/reports:/app/reports
      - ./services/report-service/templates:/app/templates
      - ./services/report-service/charts:/app/charts
      - ./services/report-service/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Wind Farm Service
  windfarm-service:
    build:
      context: ./services/windfarm-service
      dockerfile: Dockerfile
    container_name: wind-farm-windfarm-service
    ports:
      - "8006:8006"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/4
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Tenant Service
  tenant-service:
    build:
      context: ./services/tenant-service
      dockerfile: Dockerfile
    container_name: wind-farm-tenant-service
    ports:
      - "8007:8007"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@postgres:5432/windfarm
      - REDIS_URL=redis://redis:6379/5
      - JWT_SECRET_KEY=your-jwt-secret-key-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wind-farm-network
    restart: unless-stopped

  # InfluxDB for Time Series Data
  influxdb:
    image: influxdb:2.7
    container_name: wind-farm-influxdb
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=windfarm
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=password
      - INFLUXDB_USER=windfarm
      - INFLUXDB_USER_PASSWORD=password
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - wind-farm-network
    restart: unless-stopped

  # MLflow for ML Model Management
  mlflow:
    image: python:3.11-slim
    container_name: wind-farm-mlflow
    ports:
      - "5000:5000"
    command: |
      bash -c "pip install mlflow[extras] && \
               mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts"
    volumes:
      - mlflow-data:/mlflow
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Kafka UI for Monitoring
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: wind-farm-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wind-farm-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - wind-farm-network

  # Prometheus for Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: wind-farm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - wind-farm-network
    restart: unless-stopped

  # Grafana for Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: wind-farm-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - wind-farm-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  influxdb-data:
  mlflow-data:
  prometheus-data:
  grafana-data:

networks:
  wind-farm-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16