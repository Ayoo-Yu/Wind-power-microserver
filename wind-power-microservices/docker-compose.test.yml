version: '3.8'

services:
  # Test Database (separate from production)
  test-db:
    image: postgres:15-alpine
    container_name: wind-power-test-db
    environment:
      POSTGRES_DB: wind_power_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    volumes:
      - test_db_data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    networks:
      - wind-power-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d wind_power_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test Redis
  test-redis:
    image: redis:7-alpine
    container_name: wind-power-test-redis
    ports:
      - "6380:6379"
    volumes:
      - test_redis_data:/data
    networks:
      - wind-power-test-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Test Message Queue
  test-rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wind-power-test-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: test_user
      RABBITMQ_DEFAULT_PASS: test_password
      RABBITMQ_DEFAULT_VHOST: test_vhost
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - test_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wind-power-test-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # API Gateway Test Instance
  test-kong-db:
    image: postgres:15-alpine
    container_name: wind-power-test-kong-db
    environment:
      POSTGRES_DB: kong_test
      POSTGRES_USER: kong_test
      POSTGRES_PASSWORD: kong_test_password
    ports:
      - "5434:5432"
    volumes:
      - test_kong_db_data:/var/lib/postgresql/data
    networks:
      - wind-power-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong_test -d kong_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-kong-migration:
    image: kong:3.5.0-alpine
    container_name: wind-power-test-kong-migration
    depends_on:
      test-kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: test-kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong_test
      KONG_PG_PASSWORD: kong_test_password
      KONG_PG_DATABASE: kong_test
    command: kong migrations bootstrap
    networks:
      - wind-power-test-network

  test-kong:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: wind-power-test-kong
    depends_on:
      test-kong-migration:
        condition: service_completed_successfully
      test-kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: test-kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong_test
      KONG_PG_PASSWORD: kong_test_password
      KONG_PG_DATABASE: kong_test
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_PLUGINS: bundled,jwt-custom,prometheus,rate-limiting,cors
    ports:
      - "8001:8001"
      - "8000:8000"
    networks:
      - wind-power-test-network
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 5

  # Test Service Instances
  test-meteorological-service:
    build:
      context: ./meteorological-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-meteorological
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: test_user
      RABBITMQ_PASSWORD: test_password
      PORT: 8001
    ports:
      - "8001:8001"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./meteorological-service:/app
      - /app/node_modules
    command: npm run test:watch

  test-scada-service:
    build:
      context: ./scada-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-scada
    environment:
      FLASK_ENV: testing
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: test_user
      RABBITMQ_PASSWORD: test_password
      PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./scada-service:/app
    command: python -m pytest tests/ -v --cov=app --cov-report=xml

  test-power-prediction-service:
    build:
      context: ./power-prediction-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-power-prediction
    environment:
      FLASK_ENV: testing
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: test_user
      RABBITMQ_PASSWORD: test_password
      MODEL_REGISTRY_PATH: /app/models
      PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./power-prediction-service:/app
      - test_models:/app/models
    command: python -m pytest tests/ -v --cov=app --cov-report=xml

  test-report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-report
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: test_user
      RABBITMQ_PASSWORD: test_password
      REPORT_STORAGE_PATH: /app/reports
      PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./report-service:/app
      - test_reports:/app/reports
      - /app/node_modules
    command: npm run test:watch

  test-tenant-service:
    build:
      context: ./tenant-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-tenant
    environment:
      NODE_ENV: test
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      JWT_SECRET: test_jwt_secret_key_for_testing_only
      JWT_EXPIRES_IN: 1h
      PORT: 8007
    ports:
      - "8007:8007"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./tenant-service:/app
      - /app/node_modules
    command: npm run test:watch

  test-wind-farm-service:
    build:
      context: ./wind-farm-service
      dockerfile: Dockerfile
      target: test
    container_name: wind-power-test-wind-farm
    environment:
      FLASK_ENV: testing
      DB_HOST: test-db
      DB_PORT: 5432
      DB_NAME: wind_power_test
      DB_USER: test_user
      DB_PASSWORD: test_password
      REDIS_HOST: test-redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: test-rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: test_user
      RABBITMQ_PASSWORD: test_password
      PORT: 8006
    ports:
      - "8006:8006"
    depends_on:
      test-db:
        condition: service_healthy
      test-redis:
        condition: service_healthy
      test-rabbitmq:
        condition: service_healthy
    networks:
      - wind-power-test-network
    volumes:
      - ./wind-farm-service:/app
    command: python -m pytest tests/ -v --cov=app --cov-report=xml

  # Test Runner Container
  test-runner:
    image: node:18-alpine
    container_name: wind-power-test-runner
    depends_on:
      - test-meteorological-service
      - test-scada-service
      - test-power-prediction-service
      - test-report-service
      - test-tenant-service
      - test-wind-farm-service
      - test-kong
    networks:
      - wind-power-test-network
    volumes:
      - ./tests:/tests
      - ./scripts:/scripts
    working_dir: /tests
    command: |
      sh -c "
        echo 'Waiting for all services to be ready...' &&
        sleep 30 &&
        echo 'Running integration tests...' &&
        npm test ||
        echo 'No test runner configured, services are ready for testing'
      "

networks:
  wind-power-test-network:
    driver: bridge

volumes:
  test_db_data:
  test_redis_data:
  test_rabbitmq_data:
  test_kong_db_data:
  test_models:
  test_reports: