apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-service-config
  namespace: wind-power
data:
  TENANT_SERVICE_ENVIRONMENT: "production"
  TENANT_SERVICE_DATABASE_URL: "postgresql://postgres:5432/windpower_tenant"
  TENANT_SERVICE_REDIS_URL: "redis://redis:6379/1"
  TENANT_SERVICE_LOG_LEVEL: "INFO"
  TENANT_SERVICE_CORS_ORIGINS: "http://localhost:3000,http://localhost:8080,http://windpower.local"
  TENANT_SERVICE_JWT_ALGORITHM: "HS256"
  TENANT_SERVICE_JWT_EXPIRATION_MINUTES: "30"
  TENANT_SERVICE_RATE_LIMIT_REQUESTS_PER_MINUTE: "60"
---
apiVersion: v1
kind: Secret
metadata:
  name: tenant-service-secrets
  namespace: wind-power
type: Opaque
data:
  # Base64 encoded values - replace with actual secrets in production
  TENANT_SERVICE_SECRET_KEY: eW91ci1zZWNyZXQta2V5LWhlcmUtbWFrZS1pdC1sb25nLWFuZC1yYW5kb20=  # your-secret-key-here-make-it-long-and-random
  TENANT_SERVICE_DB_PASSWORD: cGFzc3dvcmQ=  # password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  namespace: wind-power
  labels:
    app: tenant-service
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tenant-service
  template:
    metadata:
      labels:
        app: tenant-service
        component: backend
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:15-alpine
        command: ['sh', '-c', 'until pg_isready -h postgres -p 5432; do echo waiting for postgres; sleep 2; done;']
      containers:
      - name: tenant-service
        image: windpower/tenant-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8001
          name: http
        env:
        - name: TENANT_SERVICE_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: tenant-service-secrets
              key: TENANT_SERVICE_SECRET_KEY
        - name: TENANT_SERVICE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tenant-service-secrets
              key: TENANT_SERVICE_DB_PASSWORD
        envFrom:
        - configMapRef:
            name: tenant-service-config
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  namespace: wind-power
  labels:
    app: tenant-service
    component: backend
spec:
  selector:
    app: tenant-service
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-service-network-policy
  namespace: wind-power
spec:
  podSelector:
    matchLabels:
      app: tenant-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: wind-power
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8001
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: wind-power
    ports:
    - protocol: TCP
      port: 5432  # PostgreSQL
    - protocol: TCP
      port: 6379  # Redis
  - to: []  # Allow DNS resolution
    ports:
    - protocol: UDP
      port: 53