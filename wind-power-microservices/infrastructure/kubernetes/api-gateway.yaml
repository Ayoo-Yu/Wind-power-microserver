apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: wind-power
  labels:
    app: api-gateway
    component: gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        component: gateway
    spec:
      containers:
      - name: api-gateway
        image: windpower/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: API_GATEWAY_ENVIRONMENT
          value: "production"
        - name: API_GATEWAY_REDIS_URL
          value: "redis://redis:6379/0"
        - name: API_GATEWAY_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-gateway-secrets
              key: secret-key
        - name: API_GATEWAY_LOG_LEVEL
          value: "INFO"
        - name: API_GATEWAY_CORS_ORIGINS
          value: "*"
        - name: API_GATEWAY_TENANT_SERVICE_URL
          value: "http://tenant-service:8001"
        - name: API_GATEWAY_SCADA_SERVICE_URL
          value: "http://scada-service:8002"
        - name: API_GATEWAY_METEOROLOGICAL_SERVICE_URL
          value: "http://meteorological-service:8003"
        - name: API_GATEWAY_PREDICTION_SERVICE_URL
          value: "http://prediction-service:8004"
        - name: API_GATEWAY_REPORTING_SERVICE_URL
          value: "http://reporting-service:8005"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: wind-power
  labels:
    app: api-gateway
    component: gateway
spec:
  selector:
    app: api-gateway
  ports:
  - port: 80
    targetPort: 8080
    name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: wind-power
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
spec:
  ingressClassName: nginx
  rules:
  - host: windpower.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: api-gateway-secrets
  namespace: wind-power
type: Opaque
data:
  # Base64 encoded secret key - replace with actual secret in production
  secret-key: eW91ci1zZWNyZXQta2V5LWhlcmUtbWFrZS1pdC1sb25nLWFuZC1yYW5kb20=  # your-secret-key-here-make-it-long-and-random