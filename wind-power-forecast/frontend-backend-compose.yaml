services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: wind-power-frontend:v250715_1.0
    ports:
      - "8080:80"
    networks:
      - wind-power-network  # 鏉╃偞甯撮崥灞肩缂冩垹绮?
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai # Set Timezone to Beijing Time
    restart: unless-stopped
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: wind-power-backend:v250714_1.0
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DB_HOST=kingbase       # 娴ｈ法鏁ら柌鎴滅波閺佺増宓佹惔鎾存箛閸斺€虫倳缁?
      - DB_PORT=54321          # 闁叉垳绮ㄩ弫鐗堝祦鎼存挾顏崣?
      - DB_USER=system         # 闁叉垳绮ㄦ妯款吇閻劍鍩?
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DB_NAME=windpower      # 鏉╃偞甯撮崚鐨恑ndpower閺佺増宓佹惔?
      - DB_SCHEMA_ACTION=${DB_SCHEMA_ACTION:-prepare}
      - DB_SCHEMA_STRICT=${DB_SCHEMA_STRICT:-true}
      - TZ=Asia/Shanghai # Set Timezone to Beijing Time
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - CREDENTIAL_ENCRYPTION_KEY_FILE=${CREDENTIAL_ENCRYPTION_KEY_FILE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - SCADA_REALTIME_ENABLED=${SCADA_REALTIME_ENABLED:-false}
      - SCADA_REQUIRED=${SCADA_REQUIRED:-false}
      - SCADA_WORKER_SECRET=${SCADA_WORKER_SECRET:-}
      - SCADA_MANAGEMENT_AUTH_REQUIRED=true
      - SCADA_ALLOWED_NETWORKS=${SCADA_ALLOWED_NETWORKS:-}
      - SCADA_DATA_STALE_AFTER_SECONDS=${SCADA_DATA_STALE_AFTER_SECONDS:-1200}
      - SCADA_INGEST_RETENTION_DAYS=${SCADA_INGEST_RETENTION_DAYS:-30}
      - SOURCE_OBSERVATION_RETENTION_DAYS=${SOURCE_OBSERVATION_RETENTION_DAYS:-180}
      - INGESTION_BATCH_RETENTION_DAYS=${INGESTION_BATCH_RETENTION_DAYS:-730}
      - PREDICTION_LINEAGE_RETENTION_DAYS=${PREDICTION_LINEAGE_RETENTION_DAYS:-730}
      - NWP_INGESTION_ENABLED=${NWP_INGESTION_ENABLED:-false}
      - NWP_INGESTION_REQUIRED=${NWP_INGESTION_REQUIRED:-false}
      - NWP_DATA_STALE_AFTER_SECONDS=${NWP_DATA_STALE_AFTER_SECONDS:-21600}
      - ACTUAL_POWER_RAW_FALLBACK_MAX_AGE_SECONDS=${ACTUAL_POWER_RAW_FALLBACK_MAX_AGE_SECONDS:-900}
      - ACTUAL_POWER_TURBINE_SOURCE_UNIT=${ACTUAL_POWER_TURBINE_SOURCE_UNIT:-kW}
      - MODEL_AUTO_APPROVAL_ENABLED=${MODEL_AUTO_APPROVAL_ENABLED:-false}
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_LOOKBACK_DAYS=${REGULATORY_EVALUATION_LOOKBACK_DAYS:-3}
      - INTEGRATION_API_ENABLED=${INTEGRATION_API_ENABLED:-false}
      - INTEGRATION_API_REQUIRED=${INTEGRATION_API_REQUIRED:-false}
      - INTEGRATION_API_TOKEN=${INTEGRATION_API_TOKEN:-}
      - INTEGRATION_SPOOL_DIR=/app/runtime/integration
    networks:
      - wind-power-network
    # No depends_on for kingbase: backend starts independently and auto-reconnects.
    restart: unless-stopped
    volumes:
      - ./backend/runtime/integration:/app/runtime/integration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  scada-manager:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:v250715_1.0}
    entrypoint: ["python", "scada_manager_main.py"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - SCADA_REALTIME_ENABLED=${SCADA_REALTIME_ENABLED:-false}
      - SCADA_WORKER_SECRET=${SCADA_WORKER_SECRET:-}
      - SCADA_ALLOWED_NETWORKS=${SCADA_ALLOWED_NETWORKS:-}
      - SCADA_BACKEND_URL=http://backend:5000
      - SCADA_MANAGER_HEALTH_PORT=9102
    networks:
      - wind-power-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  integration-processor:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:v250715_1.0}
    entrypoint: ["python", "-m", "integration.processor", "--spool", "/app/runtime/integration"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - NWP_INGESTION_ENABLED=${NWP_INGESTION_ENABLED:-false}
    volumes:
      - ./backend/runtime/integration:/app/runtime/integration
    networks:
      - wind-power-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  scada_client_service:
    profiles: ["legacy-c104"]
    build:
      context: ../C104_SCADA
      dockerfile: Dockerfile
    image: c104-scada-client:v250715.1.0
    container_name: c104-scada-client
    environment:
      - TZ=Asia/Shanghai
    networks:
      - wind-power-network              
    restart: unless-stopped
    volumes:
      - ../C104_SCADA/config.ini:/app/config.ini
      - ../C104_SCADA/logs:/app/logs
      - ../C104_SCADA/data:/app/data
      - ../C104_SCADA/state:/app/state
    healthcheck:
      test: ["CMD", "python", "health_check.py"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s

  kingbase:
    image: kingbase_v009r001c002b0014_single_x86:v1
    container_name: wind-power-kingbase
    privileged: true  # 韫囧懘銆忓ǎ璇插閿涘苯鎯侀崚娆庣窗閺堝娼堥梽鎰版６妫?
    environment:
      - NEED_START=yes
      - DB_USER=system  # 闁叉垳绮ㄦ妯款吇閻劍鍩?
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}  # 闁叉垳绮ㄦ妯款吇鐎靛棛鐖?
      - DB_MODE=oracle  # 娴ｈ法鏁racle濡€崇础閿涘矁绻栭弰顖炲櫨娴犳挻甯归懡鎰畱濡€崇础
      - ENCODING=UTF8
      - TZ=Asia/Shanghai # Set Timezone to Beijing Time
    volumes:
      - kingbase_data:/home/kingbase/userdata/  # 濞夈劍鍓版潻娆撳櫡閻ㄥ嫯鐭惧?
    ports:
      - "127.0.0.1:54321:54321"
    restart: unless-stopped
    networks:
      - wind-power-network
    command: /usr/sbin/init  # 韫囧懘銆忔担璺ㄦ暏濮濄倕鎳℃禒銈呮儙閸?
    healthcheck:
      test: ["CMD", "ls", "/home/kingbase/userdata/data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:v250715_1.0}
    container_name: wind-power-celery-worker
    command: ["worker", "--loglevel=info", "-c", "4", "--without-heartbeat"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - CREDENTIAL_ENCRYPTION_KEY_FILE=${CREDENTIAL_ENCRYPTION_KEY_FILE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - MODEL_AUTO_APPROVAL_ENABLED=${MODEL_AUTO_APPROVAL_ENABLED:-false}
      - SCADA_DATA_STALE_AFTER_SECONDS=${SCADA_DATA_STALE_AFTER_SECONDS:-1200}
      - NWP_DATA_STALE_AFTER_SECONDS=${NWP_DATA_STALE_AFTER_SECONDS:-21600}
      - ACTUAL_POWER_RAW_FALLBACK_MAX_AGE_SECONDS=${ACTUAL_POWER_RAW_FALLBACK_MAX_AGE_SECONDS:-900}
      - ACTUAL_POWER_TURBINE_SOURCE_UNIT=${ACTUAL_POWER_TURBINE_SOURCE_UNIT:-kW}
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_HOUR=${REGULATORY_EVALUATION_HOUR:-1}
      - REGULATORY_EVALUATION_MINUTE=${REGULATORY_EVALUATION_MINUTE:-20}
      - REGULATORY_EVALUATION_LOOKBACK_DAYS=${REGULATORY_EVALUATION_LOOKBACK_DAYS:-3}
    networks:
      - wind-power-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      # 娑擃厽婀℃０鍕ゴ閻╃鍙ч惄顔肩秿
      - ./backend/auto_scripts/scripts/middle/datasets:/app/auto_scripts/scripts/middle/datasets
      - ./backend/auto_scripts/scripts/middle/predict_inputs:/app/auto_scripts/scripts/middle/predict_inputs
      - ./backend/auto_scripts/scripts/middle/models:/app/auto_scripts/scripts/middle/models
      - ./backend/auto_scripts/scripts/middle/predict_outputs:/app/auto_scripts/scripts/middle/predict_outputs
      - ./backend/auto_scripts/scripts/middle/logs:/app/auto_scripts/scripts/middle/logs
      - ./backend/auto_scripts/scripts/middle/merged_predict_outputs:/app/auto_scripts/scripts/middle/merged_predict_outputs
      - ./backend/auto_scripts/scripts/middle/feature_importance:/app/auto_scripts/scripts/middle/feature_importance
      # 閻厽婀℃０鍕ゴ閻╃鍙ч惄顔肩秿
      - ./backend/auto_scripts/scripts/short/datasets:/app/auto_scripts/scripts/short/datasets
      - ./backend/auto_scripts/scripts/short/predict_inputs:/app/auto_scripts/scripts/short/predict_inputs
      - ./backend/auto_scripts/scripts/short/models:/app/auto_scripts/scripts/short/models
      - ./backend/auto_scripts/scripts/short/predict_outputs:/app/auto_scripts/scripts/short/predict_outputs
      - ./backend/auto_scripts/scripts/short/logs:/app/auto_scripts/scripts/short/logs
      - ./backend/auto_scripts/scripts/short/feature_importance:/app/auto_scripts/scripts/short/feature_importance
      # 鐡掑懐鐓張鐔碱暕濞村娴夐崗宕囨窗瑜?
      - ./backend/auto_scripts/scripts/supershort/datasets:/app/auto_scripts/scripts/supershort/datasets
      - ./backend/auto_scripts/scripts/supershort/saved_models:/app/auto_scripts/scripts/supershort/saved_models
      - ./backend/auto_scripts/scripts/supershort/prediction_inputs:/app/auto_scripts/scripts/supershort/prediction_inputs
      - ./backend/auto_scripts/scripts/supershort/prediction_results:/app/auto_scripts/scripts/supershort/prediction_results
      - ./backend/auto_scripts/scripts/supershort/logs:/app/auto_scripts/scripts/supershort/logs

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:v250715_1.0}
    container_name: wind-power-celery-beat
    command: ["beat", "--loglevel=info"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD:-change-me-in-production}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - CREDENTIAL_ENCRYPTION_KEY_FILE=${CREDENTIAL_ENCRYPTION_KEY_FILE:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_HOUR=${REGULATORY_EVALUATION_HOUR:-1}
      - REGULATORY_EVALUATION_MINUTE=${REGULATORY_EVALUATION_MINUTE:-20}
    networks:
      - wind-power-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  celery-flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:v250715_1.0}
    container_name: wind-power-celery-flower
    profiles: ["maintenance"]
    command: ["flower", "--port=5555", "--basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-change-me-before-maintenance}"]
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - TZ=Asia/Shanghai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - wind-power-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wind-power-redis
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - wind-power-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: wind-power-pgadmin
    profiles: ["maintenance"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@localhost.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-change-me-before-maintenance}
      TZ: Asia/Shanghai # Set Timezone to Beijing Time
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      kingbase:
        condition: service_started  # 娣囶喗鏁兼稉绨奺rvice_started閿涘奔绗夊Λ鈧弻銉ヤ淮鎼撮濮搁幀?
    restart: unless-stopped
    networks:
      - wind-power-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:  # 婢圭増妲戦崨钘夋倳閸?
  kingbase_data:
  pgadmin_data:

networks:
  wind-power-network:
    driver: bridge
