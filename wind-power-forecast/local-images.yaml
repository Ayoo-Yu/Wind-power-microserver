# 宸叉洿鏂扮殑local-images.yaml锛岄€傜敤浜庝簯鏈嶅姟鍣ㄩ儴缃?

services:
  frontend:
    image: wind-power-forecast-frontend:latest
    ports:
      - "8080:80"
    networks:
      - wind-power-network
    depends_on:
      - backend

  backend:
    image: wind-power-forecast-backend:latest
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DB_HOST=kingbase       # 淇敼涓洪噾浠撴暟鎹簱
      - DB_PORT=54321          # 閲戜粨鏁版嵁搴撶鍙?
      - DB_USER=system         # 閲戜粨榛樿鐢ㄦ埛
      - DB_PASSWORD=12345678ab # 閲戜粨榛樿瀵嗙爜
      - DB_NAME=windpower      # 鏁版嵁搴撳悕
    networks:
      - wind-power-network
    depends_on:
      kingbase:
        condition: service_started  # 閲戜粨鏁版嵁搴撲笉鏀寔鍋ュ悍妫€鏌ワ紝浣跨敤service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kingbase:
    image: kingbase_v009r001c002b0014_single_x86:v1
    container_name: wind-power-kingbase
    privileged: true  # 閲戜粨鏁版嵁搴撻渶瑕佺壒鏉冩ā寮?
    environment:
      - NEED_START=yes
      - DB_USER=system
      - DB_PASSWORD=12345678ab
      - DB_MODE=oracle  # 閲戜粨鏁版嵁搴撴帹鑽愪娇鐢╫racle妯″紡
      - ENCODING=UTF8
    volumes:
      - kingbase_data:/home/kingbase/userdata/
    ports:
      - "54321:54321"
    restart: unless-stopped
    networks:
      - wind-power-network
    command: /usr/sbin/init

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: wind-power-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      kingbase:
        condition: service_started
    restart: unless-stopped
    networks:
      - wind-power-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  kingbase_data:  # 淇敼涓洪噾浠撴暟鎹嵎
    name: wind-power-kingbase-data
  pgadmin_data:
    name: wind-power-pgadmin-data

networks:
  wind-power-network:
    driver: bridge
