# frontend-backend-compose.yml (Linux 閮ㄧ讲鐗堟湰)
version: '3.8'

services:
  frontend:
    # build: (鍒犻櫎 build 閮ㄥ垎)
    image: wind-power-frontend:v250522_1.0  # <--- 浣跨敤浣犲鍑虹殑闀滃儚鍚嶇О鍜屾爣绛?
    ports:
      - "8080:80"
    networks:
      - wind-power-network
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai

  backend:
    # build: (鍒犻櫎 build 閮ㄥ垎)
    image: wind-power-backend:v250522_1.0 # <--- 浣跨敤浣犲鍑虹殑闀滃儚鍚嶇О鍜屾爣绛?
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production # 寤鸿鐢熶骇鐜浣跨敤 production
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=12345678ab # 寮虹儓寤鸿浣跨敤 .env 鏂囦欢鎴?Docker secrets 绠＄悊瀵嗙爜
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    networks:
      - wind-power-network
    depends_on:
      kingbase:
        condition: service_started
    restart: on-failure
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  kingbase:
    image: kingbase_v009r001c002b0014_single_x86:v1 # <--- 纭繚杩欎釜闀滃儚涔熻 load 鍒?Linux
    container_name: wind-power-kingbase
    privileged: true
    environment:
      - NEED_START=yes
      - DB_USER=system
      - DB_PASSWORD=12345678ab # 寮虹儓寤鸿浣跨敤 .env 鏂囦欢鎴?Docker secrets
      - DB_MODE=oracle
      - ENCODING=UTF8
      - TZ=Asia/Shanghai
    volumes:
      - kingbase_data:/home/kingbase/userdata/
    ports:
      - "54321:54321"
    restart: unless-stopped
    networks:
      - wind-power-network
    command: /usr/sbin/init
    healthcheck:
      test: ["CMD", "ls", "/home/kingbase/userdata/data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pgadmin:
    image: dpage/pgadmin4:latest # <--- 浣跨敤浣犲鍑虹殑闀滃儚鏍囩
    container_name: wind-power-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com # 寤鸿淇敼涓哄畨鍏ㄧ殑鍑瘉
      PGADMIN_DEFAULT_PASSWORD: admin # 寮虹儓寤鸿浣跨敤 .env 鏂囦欢鎴?Docker secrets
      TZ: Asia/Shanghai
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      kingbase:
        condition: service_started
    restart: unless-stopped
    networks:
      - wind-power-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  kingbase_data:
  pgadmin_data:

networks:
  wind-power-network:
    driver: bridge
