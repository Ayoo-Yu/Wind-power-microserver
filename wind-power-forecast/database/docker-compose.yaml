version: '3.8'

services:
  kingbase:
    image: kingbase_v009r001c002b0014_single_x86:v1  # 璇锋浛鎹负瀹為檯瀵煎叆鐨勯噾浠撴暟鎹簱闀滃儚鍚嶇О鍜屾爣绛?
    container_name: wind-power-kingbase
    environment:
      KINGBASE_USER: system
      KINGBASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      KINGBASE_DB: windpower
    volumes:
      - kingbase_data:/opt/kingbase/data  # 鏍规嵁閲戜粨鏁版嵁搴撶殑鏁版嵁瀛樺偍璺緞鍙兘闇€瑕佽皟鏁?
    ports:
      - "54321:54321"  # 閲戜粨鏁版嵁搴撻粯璁ょ鍙ｄ负54321
    restart: unless-stopped
    networks:
      - wind-power-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: wind-power-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD must be set}
    ports:
      - "5050:80"
    depends_on:
      - kingbase
    restart: unless-stopped
    networks:
      - wind-power-network

volumes:  # 澹版槑鍛藉悕鍗?
  kingbase_data:

networks:
  wind-power-network:
    driver: bridge
