services:
  frontend:
    image: ${FRONTEND_IMAGE:-wind-power-frontend:v250715_1.0}
    ports:
      - "8080:80"
    networks:
      - wind-power-network
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  backend:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:latest}
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - DB_SCHEMA_ACTION=${DB_SCHEMA_ACTION:-prepare}
      - DB_SCHEMA_STRICT=${DB_SCHEMA_STRICT:-true}
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SCADA_SIMULATOR_HOST=wind-power-scada-simulator
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - SCADA_REALTIME_ENABLED=${SCADA_REALTIME_ENABLED:-false}
      - SCADA_REQUIRED=${SCADA_REQUIRED:-false}
      - SCADA_WORKER_SECRET=${SCADA_WORKER_SECRET:-}
      - SCADA_MANAGEMENT_AUTH_REQUIRED=true
      - SCADA_ALLOWED_NETWORKS=${SCADA_ALLOWED_NETWORKS:-}
      - SCADA_DATA_STALE_AFTER_SECONDS=${SCADA_DATA_STALE_AFTER_SECONDS:-1200}
      - SCADA_INGEST_RETENTION_DAYS=${SCADA_INGEST_RETENTION_DAYS:-30}
      - SOURCE_OBSERVATION_RETENTION_DAYS=${SOURCE_OBSERVATION_RETENTION_DAYS:-180}
      - INGESTION_BATCH_RETENTION_DAYS=${INGESTION_BATCH_RETENTION_DAYS:-730}
      - PREDICTION_LINEAGE_RETENTION_DAYS=${PREDICTION_LINEAGE_RETENTION_DAYS:-730}
      - NWP_INGESTION_ENABLED=${NWP_INGESTION_ENABLED:-false}
      - NWP_INGESTION_REQUIRED=${NWP_INGESTION_REQUIRED:-false}
      - NWP_DATA_STALE_AFTER_SECONDS=${NWP_DATA_STALE_AFTER_SECONDS:-21600}
      - MODEL_AUTO_APPROVAL_ENABLED=${MODEL_AUTO_APPROVAL_ENABLED:-false}
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_LOOKBACK_DAYS=${REGULATORY_EVALUATION_LOOKBACK_DAYS:-3}
      - INTEGRATION_API_ENABLED=${INTEGRATION_API_ENABLED:-false}
      - INTEGRATION_API_REQUIRED=${INTEGRATION_API_REQUIRED:-false}
      - INTEGRATION_API_TOKEN=${INTEGRATION_API_TOKEN:-}
      - INTEGRATION_SPOOL_DIR=/app/runtime/integration
    entrypoint: ["/bin/bash", "/app/backend-entrypoint.sh"]
    volumes:
      - ./app.env:/app/.env:ro
      - ./backend-entrypoint.sh:/app/backend-entrypoint.sh:ro
      - ./backend-data/forecast_models:/app/forecast_models
      - ./backend-data/uploads:/app/uploads
      - ./backend-data/forecasts:/app/forecasts
      - ./backend-data/logs:/app/logs
      - ./backend-data/saved_models:/app/saved_models
      - ./backend-data/saved_scalers:/app/saved_scalers
      - ./backend-data/saved_metrics:/app/saved_metrics
      - ./backend-data/data_etext:/app/data/etext
      - ./backend-data/archives:/app/archives
      - ./backend-data/integration:/app/runtime/integration
    networks:
      - wind-power-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  scada-manager:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:latest}
    entrypoint: ["python", "scada_manager_main.py"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - SCADA_REALTIME_ENABLED=${SCADA_REALTIME_ENABLED:-false}
      - SCADA_WORKER_SECRET=${SCADA_WORKER_SECRET:-}
      - SCADA_ALLOWED_NETWORKS=${SCADA_ALLOWED_NETWORKS:-}
      - SCADA_BACKEND_URL=http://backend:5000
      - SCADA_SIMULATOR_HOST=wind-power-scada-simulator
      - SCADA_MANAGER_HEALTH_PORT=9102
      - SCADA_MANAGER_RECONCILE_SECONDS=${SCADA_MANAGER_RECONCILE_SECONDS:-5}
      - SCADA_ALLOW_SYNTHETIC_HTTP_POLL=false
    volumes:
      - ./backend-data/logs:/app/logs
    networks:
      - wind-power-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:9102/ready', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  integration-processor:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:latest}
    entrypoint:
      - python
      - -m
      - integration.processor
      - --spool
      - /app/runtime/integration
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - SECRET_KEY=${SECRET_KEY}
      - PYTHONPATH=/app
      - TZ=Asia/Shanghai
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - NWP_INGESTION_ENABLED=${NWP_INGESTION_ENABLED:-false}
    volumes:
      - ./backend-data/integration:/app/runtime/integration
    networks:
      - wind-power-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:latest}
    container_name: wind-power-celery-worker
    command: ["worker", "--loglevel=info", "-c", "4", "--without-heartbeat"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-field}
      - MODEL_AUTO_APPROVAL_ENABLED=${MODEL_AUTO_APPROVAL_ENABLED:-false}
      - SCADA_DATA_STALE_AFTER_SECONDS=${SCADA_DATA_STALE_AFTER_SECONDS:-1200}
      - NWP_DATA_STALE_AFTER_SECONDS=${NWP_DATA_STALE_AFTER_SECONDS:-21600}
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_HOUR=${REGULATORY_EVALUATION_HOUR:-1}
      - REGULATORY_EVALUATION_MINUTE=${REGULATORY_EVALUATION_MINUTE:-20}
      - REGULATORY_EVALUATION_LOOKBACK_DAYS=${REGULATORY_EVALUATION_LOOKBACK_DAYS:-3}
    networks:
      - wind-power-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./app.env:/app/.env:ro
      - ./backend-data/data_etext:/app/data/etext
      - ./backend-data/forecast_models:/app/forecast_models
      - ./datasets:/app/auto_scripts/scripts/middle/datasets
      - ./predict_inputs:/app/auto_scripts/scripts/middle/predict_inputs
      - ./models:/app/auto_scripts/scripts/middle/models
      - ./predict_outputs:/app/auto_scripts/scripts/middle/predict_outputs
      - ./logs_middle:/app/auto_scripts/scripts/middle/logs
      - ./merged_predict_outputs:/app/auto_scripts/scripts/middle/merged_predict_outputs
      - ./feature_importance_mid:/app/auto_scripts/scripts/middle/feature_importance
      - ./datasets_short:/app/auto_scripts/scripts/short/datasets
      - ./predict_inputs_short:/app/auto_scripts/scripts/short/predict_inputs
      - ./models_short:/app/auto_scripts/scripts/short/models
      - ./predict_outputs_short:/app/auto_scripts/scripts/short/predict_outputs
      - ./logs_short:/app/auto_scripts/scripts/short/logs
      - ./feature_importance_short:/app/auto_scripts/scripts/short/feature_importance
      - ./datasets_ss:/app/auto_scripts/scripts/supershort/datasets
      - ./saved_models_ss:/app/auto_scripts/scripts/supershort/saved_models
      - ./prediction_inputs_ss:/app/auto_scripts/scripts/supershort/prediction_inputs
      - ./prediction_results_ss:/app/auto_scripts/scripts/supershort/prediction_results
      - ./logs_ss:/app/auto_scripts/scripts/supershort/logs

  celery-beat:
    image: ${PREDICTION_IMAGE:-wind-power-celery-worker:latest}
    container_name: wind-power-celery-beat
    command: ["beat", "--loglevel=info"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REPORT_SCHEDULER_MODE=${REPORT_SCHEDULER_MODE:-celery}
      - REGULATORY_EVALUATION_ENABLED=${REGULATORY_EVALUATION_ENABLED:-true}
      - REGULATORY_EVALUATION_HOUR=${REGULATORY_EVALUATION_HOUR:-1}
      - REGULATORY_EVALUATION_MINUTE=${REGULATORY_EVALUATION_MINUTE:-20}
    volumes:
      - ./app.env:/app/.env:ro
      - ./celery-beat-data:/app/celerybeat-data
    networks:
      - wind-power-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wind-power-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    networks:
      - wind-power-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  wind-power-network:
    external: true
    name: wind-power-network
