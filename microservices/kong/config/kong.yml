_format_version: "3.0"
_transform: true

# Services configuration
services:
  - name: auth-service
    url: http://auth-service:5001
    routes:
      - name: auth-route
        paths:
          - /auth
        strip_path: true

  - name: data-service
    url: http://data-service:5002
    routes:
      - name: data-route
        paths:
          - /data
        strip_path: true

  - name: prediction-service
    url: http://prediction-service:5003
    routes:
      - name: prediction-route
        paths:
          - /prediction
        strip_path: true

  - name: report-service
    url: http://report-service:5004
    routes:
      - name: report-route
        paths:
          - /report
        strip_path: true

  - name: simulation-service
    url: http://simulation-service:5005
    routes:
      - name: simulation-route
        paths:
          - /simulation
        strip_path: true

# Plugins configuration
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - X-Forwarded-For
      exposed_headers:
        - X-Auth-Token

  - name: rate-limiting
    config:
      minute: 1000
      hour: 10000
      day: 100000

  - name: request-transformer
    config:
      add:
        headers:
          - "X-Request-ID:$(request_id)"

# Upstreams configuration (for service discovery)
upstreams:
  - name: auth-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        unhealthy.http_statuses:
          - 429
          - 500
          - 503
        healthy.http_statuses:
          - 200
          - 201
        http_path: /health
        interval: 10
        timeout: 5
        successes: 2
    targets:
      - target: auth-service:5001
        weight: 100

  - name: data-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        unhealthy.http_statuses:
          - 429
          - 500
          - 503
        healthy.http_statuses:
          - 200
          - 201
        http_path: /health
        interval: 10
        timeout: 5
        successes: 2
    targets:
      - target: data-service:5002
        weight: 100

  - name: prediction-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        unhealthy.http_statuses:
          - 429
          - 500
          - 503
        healthy.http_statuses:
          - 200
          - 201
        http_path: /health
        interval: 10
        timeout: 5
        successes: 2
    targets:
      - target: prediction-service:5003
        weight: 100

  - name: report-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        unhealthy.http_statuses:
          - 429
          - 500
          - 503
        healthy.http_statuses:
          - 200
          - 201
        http_path: /health
        interval: 10
        timeout: 5
        successes: 2
    targets:
      - target: report-service:5004
        weight: 100

  - name: simulation-service-upstream
    algorithm: round-robin
    healthchecks:
      active:
        unhealthy.http_statuses:
          - 429
          - 500
          - 503
        healthy.http_statuses:
          - 200
          - 201
        http_path: /health
        interval: 10
        timeout: 5
        successes: 2
    targets:
      - target: simulation-service:5005
        weight: 100