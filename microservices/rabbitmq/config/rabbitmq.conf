# RabbitMQ configuration for wind power microservices
# ===================================================

# Basic configuration
loopback_users.guest = false
listeners.tcp.default = 5672

# SSL configuration (disabled by default)
# listeners.ssl.default = 5671
# ssl_options.cacertfile = /etc/rabbitmq/certs/ca_certificate.pem
# ssl_options.certfile = /etc/rabbitmq/certs/server_certificate.pem
# ssl_options.keyfile = /etc/rabbitmq/certs/server_key.pem
# ssl_options.verify = verify_peer
# ssl_options.fail_if_no_peer_cert = false

# Management plugin
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Prometheus metrics exporter
prometheus.tcp.port = 15692
prometheus.tcp.ip = 0.0.0.0

# Memory and disk settings
total_memory_available_override_bytes = 1073741824  # 1GB
disk_free_limit.relative = 1.0
vm_memory_high_watermark.relative = 0.6

# Queue settings
queue_master_locator = min-masters
default_vhost = windpower

# Clustering configuration (for future expansion)
# cluster_formation.peer_discovery_backend = rabbit_peer_discovery_consul
# cluster_formation.consul.host = consul
# cluster_formation.consul.acl_token = <token>

# Federation and shovel (for cross-datacenter communication)
# federation_upstream = "upstream-server"
# upstreams.federation.upstream-server.uri = amqp://user:password@remote-server:5672/%2f

# Policies for critical queues
# ==================================================
# High availability for training queues
policies.ha_training = ^
  ha-mode = exactly
  ha-params = 2
  ha-sync-mode = automatic

# Message persistence for report queues
policies.persistent_reports = ^report\.
  message-ttl = 86400000  # 24 hours
  expires = 900000        # 15 minutes

# Dead letter handling
policies.dead_letter = ^error\.
  dead-letter-routing-key = error_queue
  dead-letter-exchange = error_exchange

# Logging configuration
# ==================================================
log.file.level = info
log.console = true
log.console.level = info
log.exchange.level = info

# Security
# ==================================================
# Enable SSL for client connections
# ssl_options.versions.1 = tlsv1.2
# ssl_options.versions.2 = tlsv1.3

# Enable authentication mechanisms
auth_mechanisms.1 = PLAIN
auth_mechanisms.2 = AMQPLAIN

# Set maximum number of channels per connection
channel_max = 2048

# Set heartbeat timeout (in seconds)
heartbeat = 600

# Set TCP buffer sizes
tcp_listen_options.backlog = 128
tcp_listen_options.nodelay = true
tcp_listen_options.sndbuf = 32768
tcp_listen_options.rcvbuf = 32768