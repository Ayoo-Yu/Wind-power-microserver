apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    url: http://prometheus:9090
    basicAuth: false
    isDefault: true
    version: 1
    editable: false
    jsonData:
      httpMethod: POST
      queryTimeout: 60s
      timeInterval: 15s

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    database: "[wind-power-logs-]YYYY.MM.DD"
    basicAuth: false
    isDefault: false
    version: 1
    editable: false
    jsonData:
      esVersion: 8.0.0
      logMessageField: message
      logLevelField: level
      maxConcurrentShardRequests: 5
      timeField: "@timestamp"