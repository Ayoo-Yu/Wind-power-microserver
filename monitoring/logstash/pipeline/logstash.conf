input {
  # Beats input for Filebeat
  beats {
    port => 5044
  }

  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
  }

  # HTTP input for web application logs
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS" ]
      target => "@timestamp"
    }
  }

  # Add application information
  if [app_name] {
    mutate {
      add_field => { "application" => "%{app_name}" }
    }
  } else {
    mutate {
      add_field => { "application" => "unknown" }
    }
  }

  # Add environment information
  if [environment] {
    mutate {
      add_field => { "env" => "%{environment}" }
    }
  } else {
    mutate {
      add_field => { "env" => "development" }
    }
  }

  # Handle Python logging format
  if [message] =~ /^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) - (\w+) - (.*)$/ {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} - %{WORD:log_level} - %{GREEDYDATA:log_message}" }
    }

    if "_grokparsefailure" not in [tags] {
      mutate {
        replace => { "message" => "%{log_message}" }
        add_field => { "level" => "%{log_level}" }
      }
    }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "tags", "@version" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "wind-power-logs-%{+YYYY.MM.dd}"
    template_name => "wind-power-logs"
  }

  # Debug output (remove in production)
  stdout {
    codec => rubydebug
  }
}