# OpenTelemetry Collector configuration for wind power monitoring
receivers:
  # OTLP receiver for traces and metrics
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver for metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 10s
          static_configs:
            - targets: ['0.0.0.0:8888']

  # Jaeger receiver for traces
  jaeger:
    protocols:
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_binary:
        endpoint: 0.0.0.0:6832
      thrift_compact:
        endpoint: 0.0.0.0:6831
      thrift_http:
        endpoint: 0.0.0.0:14268

  # Filelog receiver for logs
  filelog:
    include: ["/var/log/wind-power/*.log"]
    exclude: ["/var/log/wind-power/*.gz"]
    start_at: "beginning"
    include_file_path: true
    include_file_name: true
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.timestamp
          layout: "%Y-%m-%d %H:%M:%S"
      - type: severity_parser
        parse_from: attributes.level
        mapping:
          debug: debug
          info: info
          warn: warning
          error: error
          fatal: fatal

processors:
  # Batch processor for better performance
  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

  # Memory limiter processor
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Resource processor - add service metadata
  resource:
    attributes:
      - key: service.name
        value: "wind-power-system"
        action: upsert
      - key: service.version
        value: "1.0.0"
        action: upsert
      - key: environment
        value: "production"
        action: upsert
      - key: cluster
        value: "wind-power-primary"
        action: upsert
      - key: region
        value: "primary-region"
        action: upsert

  # Attributes processor - extract service information
  attributes:
    actions:
      - key: service.name
        from_attribute: service
        action: upsert
      - key: service.instance.id
        from_attribute: instance
        action: upsert
      - key: service.namespace
        from_attribute: namespace
        action: upsert
      - key: service.version
        from_attribute: version
        action: upsert

  # Span processor - add trace metadata
  span:
    name:
      to_attributes:
        rules:
          - ^\/api\/v1\/(?<operation>\w+)\/(?<resource>\w+)$
      include:
        match_type: regexp
        span_names:
          - \/api\/v1\/.*

  # Probabilistic sampler
  probabilistic_sampler:
    hash_seed: 22
    sampling_percentage: 10

  # Filter processor - remove sensitive data
  filter:
    logs:
      exclude:
        match_type: regexp
        record_attributes:
          - key: message
            value: ".*password.*"
          - key: message
            value: ".*token.*"
          - key: message
            value: ".*secret.*"

  # Transform processor - convert units
  transform:
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["unit"], "ms") where name == "http_request_duration"
          - set(attributes["unit"], "bytes") where name == "http_request_size"

  # Cumulative to delta processor for better Prometheus compatibility
  cumulativetodelta:
    include:
      metrics:
        - http_request_duration
        - http_request_size
        - http_response_size
      match_type: strict

exporters:
  # Jaeger exporter for traces
  jaeger:
    endpoint: jaeger:14250
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8888"
    namespace: wind_power
    const_labels:
      service: otel-collector
      environment: production

  # Elasticsearch exporter for logs
  elasticsearch:
    endpoints: ["http://elasticsearch:9200"]
    index: wind-power-logs-otel
    flush_interval: 1s
    flush_bytes: 10485760 # 10MB
    retry:
      enabled: true
      initial_interval: 100ms
      max_interval: 10s
      max_elapsed_time: 300s

  # Loki exporter for logs
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    labels:
      resource:
        service.name: "service_name"
        service.instance.id: "instance_id"
        environment: "environment"
      attributes:
        log.level: "level"
        log.file.path: "file_path"

  # OTLP exporter for traces
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true
    timeout: 5s
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 1000

  # OTLP HTTP exporter
  otlphttp:
    endpoint: http://jaeger:4318
    tls:
      insecure: true
    timeout: 5s

  # Logging exporter for debugging
  logging:
    loglevel: info
    sampling_initial: 2
    sampling_thereafter: 500
    verbosity: normal

  # File exporter for backup
  file:
    path: /var/log/otel/traces.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3
    format: json

extensions:
  # Health check extension
  health_check:
    endpoint: 0.0.0.0:13133
    path: /health
    check_collector_pipeline:
      enabled: true
      interval: 5m
      exporter_failure_threshold: 5

  # Performance profiling extension
  pprof:
    endpoint: 0.0.0.0:1777
    block_profile_fraction: 0
    mutex_profile_fraction: 0
    save_to_file: ""

  # zPages extension for debugging
  zpages:
    endpoint: 0.0.0.0:55679

  # Memory Ballast extension
  memory_ballast:
    size_mib: 64

service:
  extensions: [health_check, pprof, zpages, memory_ballast]

  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp, jaeger]
      processors: [memory_limiter, batch, resource, attributes, span, probabilistic_sampler]
      exporters: [jaeger, otlp, otlphttp, logging, file]

    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource, attributes, transform, cumulativetodelta]
      exporters: [prometheus, logging]

    # Logs pipeline
    logs:
      receivers: [otlp, filelog]
      processors: [memory_limiter, batch, resource, attributes, filter]
      exporters: [elasticsearch, loki, logging]

  # Telemetry configuration for the collector itself
  telemetry:
    logs:
      level: info
      development: false
      sampling:
        initial: 2
        thereafter: 500
      output_paths: [stdout, /var/log/otel/collector.log]
      error_output_paths: [stderr, /var/log/otel/collector-errors.log]
      initial_fields:
        service: otel-collector
        environment: production
    metrics:
      level: detailed
      address: 0.0.0.0:8888
    traces:
      processors:
        - batch:
            timeout: 1s
            send_batch_size: 1024
      propagators:
        - tracecontext
        - baggage
        - jaeger
        - b3