# Elasticsearch configuration for wind power monitoring system
cluster.name: wind-power-cluster
node.name: wind-power-elasticsearch
path.data: /usr/share/elasticsearch/data
path.logs: /usr/share/elasticsearch/logs

# Network settings
network.host: 0.0.0.0
http.port: 9200
transport.port: 9300

# Discovery settings for single node
discovery.type: single-node

# Security settings (disabled for development, enable in production)
xpack.security.enabled: false
xpack.security.enrollment.enabled: false

# Performance settings
bootstrap.memory_lock: false
indices.memory.index_buffer_size: 30%
indices.queries.cache.size: 15%
indices.fielddata.cache.size: 30%

# Index settings
indices.query.bool.max_clause_count: 8192
search.max_buckets: 100000

# Logging settings
logger.org.elasticsearch.discovery: INFO
logger.org.elasticsearch.cluster.service: INFO
logger.org.elasticsearch.indices: INFO

# Monitoring settings
xpack.monitoring.collection.enabled: true
xpack.monitoring.collection.interval: 10s
xpack.monitoring.history.duration: 7d

# ILM (Index Lifecycle Management) settings
xpack.ilm.enabled: true

# CORS settings for Kibana
http.cors.enabled: true
http.cors.allow-origin: "*"
http.cors.allow-headers: "X-Requested-With,Content-Type,Content-Length,Authorization"
http.cors.allow-credentials: true

# JVM settings
# ES_JAVA_OPTS is set in docker-compose file