# Logstash configuration for wind power microservices
input {
  # Beats input from Filebeat
  beats {
    port => 5044
    type => "logs"
  }

  # TCP input for application logs
  tcp {
    port => 5000
    type => "app_logs"
    codec => json_lines
  }

  # UDP input for syslog
  udp {
    port => 5000
    type => "syslog"
    codec => json_lines
  }
}

filter {
  # Parse JSON logs from microservices
  if [type] == "app_logs" or [fields][service] {
    json {
      source => "message"
      target => "parsed"
    }

    # Extract service information
    if [fields][service] {
      mutate {
        add_field => { "service" => "%{[fields][service]}" }
        add_field => { "environment" => "%{[fields][environment]}" }
        add_field => { "container_name" => "%{[fields][container_name]}" }
      }
    }

    # Parse timestamp
    if [parsed][timestamp] {
      date {
        match => [ "[parsed][timestamp]", "ISO8601", "yyyy-MM-dd HH:mm:ss" ]
        target => "@timestamp"
      }
    }

    # Extract log level
    if [parsed][level] {
      mutate {
        add_field => { "log_level" => "%{[parsed][level]}" }
      }
    }

    # Extract error information
    if [parsed][error] {
      mutate {
        add_field => { "error_message" => "%{[parsed][error][message]}" }
        add_field => { "error_stack" => "%{[parsed][error][stack]}" }
      }
    }

    # Extract request information for API logs
    if [parsed][request] {
      mutate {
        add_field => { "request_method" => "%{[parsed][request][method]}" }
        add_field => { "request_url" => "%{[parsed][request][url]}" }
        add_field => { "request_ip" => "%{[parsed][request][ip]}" }
        add_field => { "response_status" => "%{[parsed][response][status]}" }
        add_field => { "response_time" => "%{[parsed][response][time]}" }
      }
    }

    # Extract business metrics for wind power
    if [parsed][wind_farm_id] {
      mutate {
        add_field => { "wind_farm_id" => "%{[parsed][wind_farm_id]}" }
        add_field => { "turbine_id" => "%{[parsed][turbine_id]}" }
        add_field => { "power_output" => "%{[parsed][power_output]}" }
        add_field => { "wind_speed" => "%{[parsed][wind_speed]}" }
      }
    }

    # Extract prediction metrics
    if [parsed][prediction_accuracy] {
      mutate {
        add_field => { "prediction_accuracy" => "%{[parsed][prediction_accuracy]}" }
        add_field => { "prediction_horizon" => "%{[parsed][prediction_horizon]}" }
      }
    }
  }

  # System logs parsing
  if [type] == "system" {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:system_timestamp} %{SYSLOGHOST:system_host} %{DATA:system_program}(?:\[%{POSINT:system_pid}\])?: %{GREEDYDATA:system_message}" }
    }

    date {
      match => [ "system_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }
  }

  # Kong API Gateway logs
  if [fields][service] == "api-gateway" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:kong_timestamp} %{WORD:kong_log_level} %{GREEDYDATA:kong_message}" }
    }

    if [parsed][request] {
      mutate {
        add_field => { "api_method" => "%{[parsed][request][method]}" }
        add_field => { "api_path" => "%{[parsed][request][path]}" }
        add_field => { "api_status" => "%{[parsed][response][status]}" }
        add_field => { "api_latency" => "%{[parsed][response][latency]}" }
        add_field => { "api_consumer" => "%{[parsed][consumer][username]}" }
      }
    }
  }

  # Add geographical information if IP is available
  if [request_ip] {
    geoip {
      source => "request_ip"
      target => "geoip"
      database => "/usr/share/GeoIP/GeoLite2-City.mmdb"
    }
  }

  # Add timestamp field for easier querying
  mutate {
    add_field => { "log_timestamp" => "%{@timestamp}" }
  }

  # Remove unnecessary fields
  mutate {
    remove_field => [ "host", "port", "@version" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "wind-power-logs-%{+YYYY.MM.dd}"
    template_name => "wind-power-logs"
    template => "/usr/share/logstash/templates/wind-power-logs-template.json"
    template_overwrite => false
  }

  # Send to Loki for Grafana integration
  loki {
    url => "http://loki:3100/loki/api/v1/push"
    batch_size => 102400
    batch_wait => 1
    min_backoff => 100ms
    max_backoff => 10s
    max_retries => 3
    timeout => 30s
    tenant_id => "wind-power"

    labels => {
      "service" => "%{service}"
      "environment" => "%{environment}"
      "log_level" => "%{log_level}"
      "container_name" => "%{container_name}"
    }
  }

  # Debug output (comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}