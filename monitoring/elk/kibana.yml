# Kibana configuration for wind power monitoring
server.name: wind-power-kibana
server.host: 0.0.0.0
server.port: 5601
server.publicBaseUrl: http://localhost:5601

# Elasticsearch connection
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.pingTimeout: 1500
elasticsearch.requestTimeout: 30000
elasticsearch.shardTimeout: 30000

# Kibana index settings
kibana.index: .kibana
kibana.autocompleteTimeout: 1000
kibana.autocompleteTerminateAfter: 100000

# Logging settings
logging.dest: stdout
logging.quiet: false
logging.silent: false
logging.verbose: false
logging.json: false

# Security settings (disabled for development)
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "wind-power-encryption-key-32-chars-for-kibana"

# Monitoring settings
xpack.monitoring.enabled: true
xpack.monitoring.ui.container.elasticsearch.enabled: true
xpack.monitoring.kibana.collection.enabled: true
xpack.monitoring.kibana.collection.interval: 10000
xpack.monitoring.elasticsearch.collection.enabled: true
xpack.monitoring.elasticsearch.collection.interval: 10000

# Alerting settings
xpack.alerting.enabled: true
xpack.actions.enabled: true
xpack.actions.allowedHosts: ["localhost", "elasticsearch", "prometheus", "alertmanager"]

# Reporting settings
xpack.reporting.enabled: true
xpack.reporting.kibanaServer.hostname: localhost
xpack.reporting.kibanaServer.port: 5601

# Maps settings
map.includeElasticMapsService: true

# Advanced settings
server.maxPayloadBytes: 1048576
server.compression.enabled: true
server.compression.referrerWhitelist: []

# Timezone settings
dateFormat: "MMM D, YYYY @ HH:mm:ss.SSS"
dateFormat:tz: "Browser"

# CSV export settings
csv.separator: ","
csv.quoteValues: true

# Search settings
search:timeout: 300000
search:includeFrozen: false

# Index pattern settings
defaultIndex: "wind-power-logs-*"
defaultRoute: "/app/dashboards"

# Feature flags
xpack.discoverEnhanced.enabled: true
xpack.canvas.enabled: true
xpack.graph.enabled: true
xpack.ml.enabled: true
xpack.maps.enabled: true
xpack.canvas.enabled: true