# Filebeat configuration for wind power microservices
filebeat.inputs:
# Application logs from microservices
- type: log
  enabled: true
  paths:
    - /app/logs/*/app.log
    - /app/logs/*/*.log
  fields:
    service: "microservices"
    environment: "production"
    log_type: "application"
  fields_under_root: true
  json.keys_under_root: true
  json.add_error_key: true
  multiline.pattern: '^\d{4}-\d{2}-\d{2}'
  multiline.negate: true
  multiline.match: after

# Kong API Gateway logs
- type: log
  enabled: true
  paths:
    - /var/log/kong/*.log
  fields:
    service: "api-gateway"
    environment: "production"
    log_type: "gateway"
  fields_under_root: true

# System logs
- type: log
  enabled: true
  paths:
    - /var/log/syslog
    - /var/log/auth.log
    - /var/log/kern.log
  fields:
    service: "system"
    environment: "production"
    log_type: "system"
  fields_under_root: true

# Docker container logs
- type: docker
  enabled: true
  containers.ids:
    - "*"
  containers.path: "/var/lib/docker/containers"
  containers.stream: "all"
  fields:
    service: "containers"
    environment: "production"
    log_type: "container"
  fields_under_root: true
  json.keys_under_root: true
  json.add_error_key: true

# NGINX logs (if applicable)
- type: log
  enabled: true
  paths:
    - /var/log/nginx/*.log
  fields:
    service: "nginx"
    environment: "production"
    log_type: "proxy"
  fields_under_root: true

# PostgreSQL logs
- type: log
  enabled: true
  paths:
    - /var/log/postgresql/*.log
  fields:
    service: "database"
    environment: "production"
    log_type: "database"
  fields_under_root: true
  multiline.pattern: '^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}'
  multiline.negate: true
  multiline.match: after

# Redis logs
- type: log
  enabled: true
  paths:
    - /var/log/redis/*.log
  fields:
    service: "redis"
    environment: "production"
    log_type: "cache"
  fields_under_root: true

# RabbitMQ logs
- type: log
  enabled: true
  paths:
    - /var/log/rabbitmq/*.log
  fields:
    service: "rabbitmq"
    environment: "production"
    log_type: "queue"
  fields_under_root: true

# Kubernetes logs (if running in K8s)
- type: container
  enabled: true
  paths:
    - /var/log/containers/*.log
  fields:
    service: "kubernetes"
    environment: "production"
    log_type: "kubernetes"
  fields_under_root: true
  json.keys_under_root: true
  json.add_error_key: true

processors:
# Add service metadata
- add_host_metadata:
    when.not.contains.tags: forwarded
    netinfo.enabled: true
    cache.ttl: 5m

- add_docker_metadata:
    host: "unix:///var/run/docker.sock"

# Decode JSON logs
- decode_json_fields:
    fields: ["message"]
    target: ""
    overwrite_keys: true
    when:
      contains:
        message: "{"

# Extract container name and service information
- dissect:
    tokenizer: "/var/log/containers/%{container_name}_%{pod_namespace}_%{pod_name}-%{container_id}.log"
    field: "log.file.path"
    target_prefix: "container"
    when:
      contains:
        log.file.path: "/var/log/containers/"

- script:
    lang: javascript
    id: extract_service_info
    source: |
      function process(event) {
        var container_name = event.Get("container.container_name");
        if (container_name) {
          // Extract service name from container name
          var service_match = container_name.match(/^(meteorological|scada|power-prediction|report|tenant|wind-farm|api-gateway|kong)/);
          if (service_match) {
            event.Put("service", service_match[1]);
          }
        }
      }

# Add environment information
- add_fields:
    target: ""
    fields:
      environment: "production"
      datacenter: "wind-power-primary"
      cluster: "wind-power-microservices"

# Clean up fields
- drop_fields:
    when:
      has_fields: ['ecs']
    fields: ['ecs', 'agent', 'input', 'log.offset', 'log.file.device_id', 'log.file.inode']

output.logstash:
  hosts: ["logstash:5044"]
  loadbalance: true
  ssl.enabled: false
  timeout: 15s
  max_retries: 3
  bulk_max_size: 2048
  slow_start: true

# Alternative output to Elasticsearch directly
# output.elasticsearch:
#   hosts: ["elasticsearch:9200"]
#   index: "filebeat-wind-power-%{+yyyy.MM.dd}"
#   template.name: "filebeat"
#   template.path: "/usr/share/filebeat/filebeat.template.json"
#   template.overwrite: false

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644

monitoring.enabled: true
monitoring.elasticsearch:
  hosts: ["elasticsearch:9200"]

# Queue settings for reliability
queue.type: memory
queue.mem.events: 4096
queue.mem.flush.min_events: 512
queue.mem.flush.timeout: 1s