global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_exporter'
    static_configs:
      - targets: ['node_exporter:9100']

  - job_name: 'backend_service'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'autopredict_service'
    static_configs:
      - targets: ['backend-autopredict:5001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'database'
    static_configs:
      - targets: ['kingbase:5432']
    metrics_path: '/metrics'
    scrape_interval: 60s