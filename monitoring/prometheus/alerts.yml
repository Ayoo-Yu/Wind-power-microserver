# Comprehensive alerting rules for wind power monitoring system
groups:
  - name: wind-power-api-gateway
    rules:
    - alert: APIGatewayHighErrorRate
      expr: |
        (
          rate(kong_http_requests_total{job="api-gateway",code=~"5.."}[5m]) /
          rate(kong_http_requests_total{job="api-gateway"}[5m])
        ) > 0.05
      for: 5m
      labels:
        severity: warning
        component: api-gateway
        team: platform
      annotations:
        summary: "API Gateway high error rate"
        description: "API Gateway error rate is {{ $value | humanizePercentage }} for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/api-gateway-high-error-rate"
        dashboard_url: "http://grafana:3000/d/api-gateway/api-gateway-overview"
        action: "Check Kong logs and upstream service health"

    - alert: APIGatewayHighLatency
      expr: |
        histogram_quantile(0.95,
          rate(kong_request_latency_ms_bucket{job="api-gateway"}[5m])
        ) > 2000
      for: 5m
      labels:
        severity: warning
        component: api-gateway
        team: platform
      annotations:
        summary: "API Gateway high latency"
        description: "95th percentile latency is {{ $value }}ms for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/api-gateway-high-latency"
        dashboard_url: "http://grafana:3000/d/api-gateway/api-gateway-overview"
        action: "Check upstream service performance and network latency"

    - alert: APIGatewayDown
      expr: up{job="api-gateway"} == 0
      for: 2m
      labels:
        severity: critical
        component: api-gateway
        team: platform
      annotations:
        summary: "API Gateway is down"
        description: "API Gateway has been unavailable for more than 2 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/api-gateway-down"
        dashboard_url: "http://grafana:3000/d/api-gateway/api-gateway-overview"
        action: "Check Kong container status and restart if necessary"

    - alert: APIGatewayHighMemoryUsage
      expr: |
        (
          container_memory_usage_bytes{pod=~"api-gateway-.*"} /
          container_spec_memory_limit_bytes{pod=~"api-gateway-.*"}
        ) > 0.9
      for: 5m
      labels:
        severity: warning
        component: api-gateway
        team: platform
      annotations:
        summary: "API Gateway high memory usage"
        description: "API Gateway memory usage is {{ $value | humanizePercentage }} for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/api-gateway-high-memory"
        dashboard_url: "http://grafana:3000/d/api-gateway/api-gateway-overview"
        action: "Check memory usage patterns and consider scaling"

    - alert: APIGatewayHighCPUUsage
      expr: |
        (
          100 - (avg by (pod) (rate(container_cpu_usage_seconds_total{pod=~"api-gateway-.*"}[5m])) * 100)
        ) < 10
      for: 5m
      labels:
        severity: warning
        component: api-gateway
        team: platform
      annotations:
        summary: "API Gateway high CPU usage"
        description: "API Gateway CPU usage is above 90% for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/api-gateway-high-cpu"
        dashboard_url: "http://grafana:3000/d/api-gateway/api-gateway-overview"
        action: "Check CPU usage patterns and consider scaling"

  - name: wind-power-microservices
    rules:
    - alert: MicroserviceHighErrorRate
      expr: |
        (
          rate(http_requests_total{job=~"meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service",code=~"5.."}[5m]) /
          rate(http_requests_total{job=~"meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service"}[5m])
        ) > 0.05
      for: 5m
      labels:
        severity: warning
        component: microservices
        team: backend
      annotations:
        summary: "Microservice {{ $labels.job }} high error rate"
        description: "Microservice {{ $labels.job }} error rate is {{ $value | humanizePercentage }} for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/microservice-high-error-rate"
        dashboard_url: "http://grafana:3000/d/microservices/microservices-overview"
        action: "Check service logs and database connectivity"

    - alert: MicroserviceHighLatency
      expr: |
        histogram_quantile(0.95,
          rate(http_request_duration_seconds_bucket{job=~"meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service"}[5m])
        ) > 5
      for: 5m
      labels:
        severity: warning
        component: microservices
        team: backend
      annotations:
        summary: "Microservice {{ $labels.job }} high latency"
        description: "Microservice {{ $labels.job }} 95th percentile latency is {{ $value }}s for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/microservice-high-latency"
        dashboard_url: "http://grafana:3000/d/microservices/microservices-overview"
        action: "Check service performance and database queries"

    - alert: MicroserviceDown
      expr: up{job=~"meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service"} == 0
      for: 2m
      labels:
        severity: critical
        component: microservices
        team: backend
      annotations:
        summary: "Microservice {{ $labels.job }} is down"
        description: "Microservice {{ $labels.job }} has been unavailable for more than 2 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/microservice-down"
        dashboard_url: "http://grafana:3000/d/microservices/microservices-overview"
        action: "Check service container status and restart if necessary"

    - alert: MicroserviceHighMemoryUsage
      expr: |
        (
          container_memory_usage_bytes{pod=~"(meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service)-.*"} /
          container_spec_memory_limit_bytes{pod=~"(meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service)-.*"}
        ) > 0.9
      for: 5m
      labels:
        severity: warning
        component: microservices
        team: backend
      annotations:
        summary: "Microservice high memory usage"
        description: "Microservice {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/microservice-high-memory"
        dashboard_url: "http://grafana:3000/d/microservices/microservices-overview"
        action: "Check memory usage patterns and consider scaling"

    - alert: MicroserviceCircuitBreakerOpen
      expr: circuit_breaker_open{job=~"meteorological-service|scada-service|power-prediction-service|report-service|tenant-service|wind-farm-service"} == 1
      for: 1m
      labels:
        severity: critical
        component: microservices
        team: backend
      annotations:
        summary: "Circuit breaker open for {{ $labels.job }}"
        description: "Circuit breaker is open for microservice {{ $labels.job }}"
        runbook_url: "https://wiki.windpower.com/runbooks/circuit-breaker-open"
        dashboard_url: "http://grafana:3000/d/microservices/microservices-overview"
        action: "Check downstream service health and circuit breaker configuration"

  - name: wind-power-database
    rules:
    - alert: DatabaseHighConnections
      expr: |
        pg_stat_activity_count{datname="wind_power"} > 80
      for: 5m
      labels:
        severity: warning
        component: database
        team: database
      annotations:
        summary: "Database high connection count"
        description: "PostgreSQL has {{ $value }} active connections for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/database-high-connections"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check connection pool settings and active queries"

    - alert: DatabaseHighCPUUsage
      expr: |
        rate(postgresql_stat_user_tables_seq_scan{datname="wind_power"}[5m]) > 100
      for: 5m
      labels:
        severity: warning
        component: database
        team: database
      annotations:
        summary: "Database high CPU usage"
        description: "PostgreSQL is performing too many sequential scans"
        runbook_url: "https://wiki.windpower.com/runbooks/database-high-cpu"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check query execution plans and add indexes if needed"

    - alert: DatabaseReplicationLag
      expr: |
        pg_replication_lag > 60
      for: 5m
      labels:
        severity: warning
        component: database
        team: database
      annotations:
        summary: "Database replication lag"
        description: "PostgreSQL replication lag is {{ $value }}s for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/database-replication-lag"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check replication status and network connectivity"

    - alert: DatabaseSlowQueries
      expr: |
        avg_over_time(postgresql_query_duration_seconds{datname="wind_power"}[5m]) > 1
      for: 5m
      labels:
        severity: warning
        component: database
        team: database
      annotations:
        summary: "Slow database queries"
        description: "Average query duration is {{ $value }}s for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/database-slow-queries"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check slow query log and optimize queries"

  - name: wind-power-infrastructure
    rules:
    - alert: HighCPUUsage
      expr: |
        100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
      for: 5m
      labels:
        severity: warning
        component: infrastructure
        team: platform
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is {{ $value }}% for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/high-cpu-usage"
        dashboard_url: "http://grafana:3000/d/infrastructure/infrastructure-overview"
        action: "Check CPU usage patterns and consider scaling"

    - alert: HighMemoryUsage
      expr: |
        (
          1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
        ) * 100 > 85
      for: 5m
      labels:
        severity: warning
        component: infrastructure
        team: platform
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is {{ $value }}% for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/high-memory-usage"
        dashboard_url: "http://grafana:3000/d/infrastructure/infrastructure-overview"
        action: "Check memory usage and identify memory-intensive processes"

    - alert: DiskSpaceUsage
      expr: |
        (
          node_filesystem_size_bytes{mountpoint="/"} - node_filesystem_free_bytes{mountpoint="/"}
        ) / node_filesystem_size_bytes{mountpoint="/"} * 100 > 80
      for: 5m
      labels:
        severity: warning
        component: infrastructure
        team: platform
      annotations:
        summary: "High disk space usage on {{ $labels.instance }}"
        description: "Disk space usage is {{ $value }}% for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/high-disk-usage"
        dashboard_url: "http://grafana:3000/d/infrastructure/infrastructure-overview"
        action: "Check disk usage and clean up unnecessary files"

    - alert: PodCrashLooping
      expr: |
        rate(kube_pod_container_status_restarts_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
        component: infrastructure
        team: platform
      annotations:
        summary: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
        description: "Pod {{ $labels.pod }} has restarted {{ $value }} times in the last 15 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/pod-crash-looping"
        dashboard_url: "http://grafana:3000/d/kubernetes/kubernetes-overview"
        action: "Check pod logs and resource constraints"

  - name: wind-power-business-logic
    rules:
    - alert: LowPredictionAccuracy
      expr: |
        avg(wind_power_prediction_accuracy) < 0.85
      for: 10m
      labels:
        severity: warning
        component: business-logic
        team: data-science
      annotations:
        summary: "Low wind power prediction accuracy"
        description: "Wind power prediction accuracy is {{ $value | humanizePercentage }} for more than 10 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/low-prediction-accuracy"
        dashboard_url: "http://grafana:3000/d/business/business-metrics"
        action: "Check ML model performance and data quality"

    - alert: HighWindFarmOffline
      expr: |
        (
          sum(wind_farm_turbines_offline) / sum(wind_farm_turbines_total)
        ) > 0.2
      for: 5m
      labels:
        severity: warning
        component: business-logic
        team: operations
      annotations:
        summary: "High number of wind turbines offline"
        description: "{{ $value | humanizePercentage }} of wind turbines are offline for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/high-turbines-offline"
        dashboard_url: "http://grafana:3000/d/business/business-metrics"
        action: "Check turbine status and maintenance schedules"

    - alert: DataIngestionLag
      expr: |
        (
          time() - max(wind_power_last_data_timestamp)
        ) > 300
      for: 5m
      labels:
        severity: warning
        component: business-logic
        team: data-engineering
      annotations:
        summary: "Data ingestion lag detected"
        description: "No new data has been ingested for {{ $value }}s"
        runbook_url: "https://wiki.windpower.com/runbooks/data-ingestion-lag"
        dashboard_url: "http://grafana:3000/d/business/business-metrics"
        action: "Check data pipeline and source connectivity"

  - name: wind-power-security
    rules:
    - alert: HighAuthFailureRate
      expr: |
        (
          rate(kong_http_requests_total{job="api-gateway",code="401"}[5m]) /
          rate(kong_http_requests_total{job="api-gateway"}[5m])
        ) > 0.1
      for: 5m
      labels:
        severity: warning
        component: security
        team: security
      annotations:
        summary: "High authentication failure rate"
        description: "Authentication failure rate is {{ $value | humanizePercentage }} for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/high-auth-failure-rate"
        dashboard_url: "http://grafana:3000/d/security/security-overview"
        action: "Check authentication logs for potential attacks"

    - alert: SuspiciousAPICalls
      expr: |
        rate(kong_http_requests_total{job="api-gateway",code="429"}[5m]) > 10
      for: 2m
      labels:
        severity: warning
        component: security
        team: security
      annotations:
        summary: "High rate of rate-limited requests"
        description: "Rate limiting is being triggered {{ $value }} times per second"
        runbook_url: "https://wiki.windpower.com/runbooks/suspicious-api-calls"
        dashboard_url: "http://grafana:3000/d/security/security-overview"
        action: "Check for potential DDoS attacks or misconfigured clients"

  - name: wind-power-performance
    rules:
    - alert: SlowQueries
      expr: |
        avg_over_time(postgresql_query_duration_seconds{datname="wind_power"}[5m]) > 1
      for: 5m
      labels:
        severity: warning
        component: performance
        team: database
      annotations:
        summary: "Slow database queries detected"
        description: "Average query duration is {{ $value }}s for more than 5 minutes"
        runbook_url: "https://wiki.windpower.com/runbooks/slow-queries"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check slow query log and optimize database queries"

    - alert: MessageQueueBacklog
      expr: |
        rabbitmq_queue_messages{queue=~"wind-power-.*"} > 1000
      for: 5m
      labels:
        severity: warning
        component: performance
        team: platform
      annotations:
        summary: "Message queue backlog detected"
        description: "Message queue {{ $labels.queue }} has {{ $value }} messages"
        runbook_url: "https://wiki.windpower.com/runbooks/message-queue-backlog"
        dashboard_url: "http://grafana:3000/d/messaging/messaging-overview"
        action: "Check message processing rate and consumer health"

  - name: wind-power-capacity
    rules:
    - alert: HighRequestRate
      expr: |
        rate(kong_http_requests_total{job="api-gateway"}[5m]) > 1000
      for: 5m
      labels:
        severity: info
        component: capacity
        team: platform
      annotations:
        summary: "High request rate detected"
        description: "API Gateway is receiving {{ $value }} requests per second"
        runbook_url: "https://wiki.windpower.com/runbooks/high-request-rate"
        dashboard_url: "http://grafana:3000/d/capacity/capacity-overview"
        action: "Monitor system capacity and consider scaling"

    - alert: DatabaseConnectionPoolExhaustion
      expr: |
        (
          pg_stat_activity_count{datname="wind_power"} / pg_settings_max_connections
        ) > 0.8
      for: 5m
      labels:
        severity: warning
        component: capacity
        team: database
      annotations:
        summary: "Database connection pool exhaustion"
        description: "Database is using {{ $value | humanizePercentage }} of available connections"
        runbook_url: "https://wiki.windpower.com/runbooks/db-connection-pool-exhaustion"
        dashboard_url: "http://grafana:3000/d/database/database-overview"
        action: "Check connection pool settings and active connections"