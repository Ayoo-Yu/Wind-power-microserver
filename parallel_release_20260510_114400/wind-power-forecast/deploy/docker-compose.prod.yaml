version: "2.4"

services:
  frontend:
    image: wind-power-frontend:staging-20260510
    ports:
      - "18080:80"
    networks:
      - wind-power-staging-network
    depends_on:
      - backend
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

  backend:
    image: wind-power-celery-worker:staging-20260510
    ports:
      - "15000:5000"
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SCADA_SIMULATOR_HOST=wind-power-staging-scada-simulator
    entrypoint: ["/bin/bash", "/app/backend-entrypoint.sh"]
    volumes:
      - ./app.env:/app/.env:ro
      - ./backend-entrypoint.sh:/app/backend-entrypoint.sh:ro
      - ./patches/scada_worker.py:/app/services/scada_worker.py:ro
      - ./patches/services/scada_manager.py:/app/services/scada_manager.py:ro
      - ./patches/services/model_manager.py:/app/services/model_manager.py:ro
      - ./patches/services/ultrashort_model_manager.py:/app/services/ultrashort_model_manager.py:ro
      - ./patches/routes/etext_pipeline_router.py:/app/routes/etext_pipeline_router.py:ro
      - ./backend-data/forecast_models:/app/forecast_models
      - ./backend-data/uploads:/app/uploads
      - ./backend-data/forecasts:/app/forecasts
      - ./backend-data/logs:/app/logs
      - ./backend-data/saved_models:/app/saved_models
      - ./backend-data/saved_scalers:/app/saved_scalers
      - ./backend-data/saved_metrics:/app/saved_metrics
      - ./backend-data/data_etext:/app/data/etext
      - ./backend-data/archives:/app/archives
    networks:
      - wind-power-staging-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  celery-worker:
    image: wind-power-celery-worker:staging-20260510
    container_name: wind-power-staging-celery-worker
    command: ["worker", "--loglevel=info", "-c", "4", "--without-heartbeat"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - API_BASE_URL=http://backend:5000
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - wind-power-staging-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    volumes:
      - ./app.env:/app/.env:ro
      - ./patches/services/model_manager.py:/app/services/model_manager.py:ro
      - ./patches/services/ultrashort_model_manager.py:/app/services/ultrashort_model_manager.py:ro
      - ./backend-data/data_etext:/app/data/etext
      - ./backend-data/forecast_models:/app/forecast_models
      - ./datasets:/app/auto_scripts/scripts/middle/datasets
      - ./predict_inputs:/app/auto_scripts/scripts/middle/predict_inputs
      - ./models:/app/auto_scripts/scripts/middle/models
      - ./predict_outputs:/app/auto_scripts/scripts/middle/predict_outputs
      - ./logs_middle:/app/auto_scripts/scripts/middle/logs
      - ./merged_predict_outputs:/app/auto_scripts/scripts/middle/merged_predict_outputs
      - ./feature_importance_mid:/app/auto_scripts/scripts/middle/feature_importance
      - ./datasets_short:/app/auto_scripts/scripts/short/datasets
      - ./predict_inputs_short:/app/auto_scripts/scripts/short/predict_inputs
      - ./models_short:/app/auto_scripts/scripts/short/models
      - ./predict_outputs_short:/app/auto_scripts/scripts/short/predict_outputs
      - ./logs_short:/app/auto_scripts/scripts/short/logs
      - ./feature_importance_short:/app/auto_scripts/scripts/short/feature_importance
      - ./datasets_ss:/app/auto_scripts/scripts/supershort/datasets
      - ./saved_models_ss:/app/auto_scripts/scripts/supershort/saved_models
      - ./prediction_inputs_ss:/app/auto_scripts/scripts/supershort/prediction_inputs
      - ./prediction_results_ss:/app/auto_scripts/scripts/supershort/prediction_results
      - ./logs_ss:/app/auto_scripts/scripts/supershort/logs

  celery-beat:
    image: wind-power-celery-worker:staging-20260510
    container_name: wind-power-staging-celery-beat
    command: ["beat", "--loglevel=info"]
    environment:
      - DB_HOST=kingbase
      - DB_PORT=54321
      - DB_USER=system
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=windpower
      - TZ=Asia/Shanghai
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./app.env:/app/.env:ro
      - ./celery-beat-data:/app/celerybeat-data
    networks:
      - wind-power-staging-network
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wind-power-staging-redis
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes --appendfsync everysec
    restart: unless-stopped
    networks:
      - wind-power-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  pgadmin:
    image: dpage/pgadmin4
    container_name: wind-power-staging-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: Asia/Shanghai
    ports:
      - "15050:80"
    volumes:
      - ./pgadmin-data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - wind-power-staging-network
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  wind-power-staging-network:
    external:
      name: wind-power-staging-network
