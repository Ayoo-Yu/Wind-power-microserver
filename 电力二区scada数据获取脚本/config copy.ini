[Logging]
LOG_FILE = logs/scada_client_main.log       ; 日志文件路径 (建议使用子目录, 例如 'logs/')
                                            ; 脚本会尝试创建这个目录（如果不存在）
LOG_LEVEL = INFO                          ; 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
BACKUP_COUNT = 30                         ; TimedRotatingFileHandler 保留的历史日志文件数量 (天数)
CONSOLE_OUTPUT = True                     ; 是否同时将日志输出到控制台 (True/False) - 如果你的 logging_config.py 支持此参数

[IEC104_Connection]
SCADA_SERVER_IP = 127.0.0.1               ; SCADA服务器 (模拟器) IP地址 
                                            ; (如果是本机测试，通常是127.0.0.1)
                                            ; (如果是连接局域网内的模拟器或真实SCADA，请填写其IP)
SCADA_SERVER_PORT = 2404                  ; SCADA服务器 (模拟器) 端口 (IEC 104 默认端口)
CASDU_ADDRESS = 1                         ; 公共地址单元 (ASDU Common Address)
                                            ; (必须与SCADA服务器/模拟器中配置的站地址一致)
TIMEOUT_T0 = 30                           ; 连接建立超时 (秒)
TIMEOUT_T1 = 15                           ; APDU响应超时 (秒) - 例如，对总召唤的响应
TIMEOUT_T2 = 10                           ; S帧响应超时 (秒) - 在无数据报文时发送测试帧之前等待S帧的时间
TIMEOUT_T3 = 20                           ; I帧确认超时 (秒) - 在长期空闲（已发送TESTFR ACT后）时发送测试帧之后等待响应的时间
PARAM_K = 12                              ; 未确认I格式APDU的最大数量 (发送方)
PARAM_W = 8                               ; 最新收到的未确认I格式APDU序号 (接收方)
DATA_WAIT_TIMEOUT = 30                    ; 发送总召唤后，等待相关数据通过回调返回的总超时时间 (秒)

[WP_TRUE_Config]
IOA = 1009                                ; !!! 替换为你的 wp_true 在SCADA中的实际信息体地址 (IOA) !!!
                                            ; (确保与你在模拟器中配置的IOA一致)
TI_STR = M_ME_TF_1                        ; !!! 替换为你的 wp_true 实际的类型标识符字符串 !!!
                                            ; (M_ME_TF_1 对应数字TI 36: 测量值，短浮点数，带时标CP56Time2a)
                                            ; (确保与你在模拟器中配置的Type ID一致)

[API]
UPLOAD_URL = http://127.0.0.1:5000/actual_power/ ; !!! 替换为你的后端API实际的、可访问的URL !!!
                                                 ; (如果API和客户端在不同机器/容器，localhost可能无效)

[TaskConfig]
INNER_LOOP_FETCH_INTERVAL_SECONDS = 60    ; 脚本内部循环尝试从SCADA获取数据的间隔 (秒)
                                            ; (例如，每60秒获取一次最新值，作为下一个15分钟目标点的候选)