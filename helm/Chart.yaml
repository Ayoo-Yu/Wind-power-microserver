apiVersion: v2
name: wind-power-microservices
description: A Helm chart for Wind Power Forecasting System Microservices
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - wind-power
  - microservices
  - forecasting
  - renewable-energy
  - kong
  - api-gateway

home: https://github.com/wind-power/wind-power-microservices
sources:
  - https://github.com/wind-power/wind-power-microservices

maintainers:
  - name: Wind Power Team
    email: admin@windpower.com
    url: https://windpower.com

dependencies:
  - name: postgresql
    version: "12.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "17.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled
  - name: rabbitmq
    version: "11.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: rabbitmq.enabled
  - name: kong
    version: "2.x.x"
    repository: "https://charts.konghq.com"
    condition: kong.enabled

annotations:
  category: Infrastructure
  licenses: MIT
  images: |
    - name: api-gateway
      image: ghcr.io/wind-power/api-gateway:1.0.0
    - name: meteorological-service
      image: ghcr.io/wind-power/meteorological-service:1.0.0
    - name: scada-service
      image: ghcr.io/wind-power/scada-service:1.0.0
    - name: power-prediction-service
      image: ghcr.io/wind-power/power-prediction-service:1.0.0
    - name: report-service
      image: ghcr.io/wind-power/report-service:1.0.0
    - name: tenant-service
      image: ghcr.io/wind-power/tenant-service:1.0.0
    - name: wind-farm-service
      image: ghcr.io/wind-power/wind-farm-service:1.0.0