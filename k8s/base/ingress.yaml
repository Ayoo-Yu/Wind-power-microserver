apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wind-power-ingress
  namespace: wind-power
  labels:
    app.kubernetes.io/name: wind-power-ingress
    app.kubernetes.io/component: ingress
    app.kubernetes.io/part-of: wind-power
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "300"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Content-Type, Authorization, X-Requested-With"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - api.windpower.com
    - staging-api.windpower.com
    secretName: wind-power-tls-secret
  rules:
  - host: api.windpower.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /health
        pathType: Exact
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /metrics
        pathType: Exact
        backend:
          service:
            name: api-gateway
            port:
              number: 8001
  - host: staging-api.windpower.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wind-power-admin-ingress
  namespace: wind-power
  labels:
    app.kubernetes.io/name: wind-power-admin-ingress
    app.kubernetes.io/component: admin-ingress
    app.kubernetes.io/part-of: wind-power
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: wind-power-admin-auth
    nginx.ingress.kubernetes.io/auth-realm: "Wind Power Admin Panel"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - admin.windpower.com
    - staging-admin.windpower.com
    secretName: wind-power-admin-tls-secret
  rules:
  - host: admin.windpower.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8002
  - host: staging-admin.windpower.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8002

---
apiVersion: v1
kind: Secret
metadata:
  name: wind-power-admin-auth
  namespace: wind-power
type: Opaque
data:
  auth: YWRtaW46JGFwcjEkSDY1dnpwTm8kOVNvb3lNMFZxQjQyNlFuVFh4MjBXZzE=  # admin:admin123 (change in production)

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wind-power-network-policy
  namespace: wind-power
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: wind-power
    ports:
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5672
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 5432
    - protocol: TCP
      port: 6379
    - protocol: TCP
      port: 5672
    - protocol: TCP
      port: 15672
    - protocol: TCP
      port: 8001
    - protocol: TCP
      port: 8000
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@windpower.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
      selector: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wind-power-tls
  namespace: wind-power
spec:
  secretName: wind-power-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: api.windpower.com
  dnsNames:
  - api.windpower.com
  - staging-api.windpower.com

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wind-power-admin-tls
  namespace: wind-power
spec:
  secretName: wind-power-admin-tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: admin.windpower.com
  dnsNames:
  - admin.windpower.com
  - staging-admin.windpower.com