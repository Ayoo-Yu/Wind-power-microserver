apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: wind-power
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: wind-power
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: wind-power
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_DB
          value: wind_power
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: DB_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: DB_PASSWORD
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF8 --locale=en_US.UTF-8"
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgres
        - name: postgres-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: postgres-init
        configMap:
          name: postgres-init-scripts
          defaultMode: 0755
      restartPolicy: Always

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: wind-power
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: wind-power
data:
  init-wind-power-db.sql: |
    -- Create databases for all services
    CREATE DATABASE IF NOT EXISTS meteorological_db;
    CREATE DATABASE IF NOT EXISTS scada_db;
    CREATE DATABASE IF NOT EXISTS power_prediction_db;
    CREATE DATABASE IF NOT EXISTS report_db;
    CREATE DATABASE IF NOT EXISTS tenant_db;
    CREATE DATABASE IF NOT EXISTS wind_farm_db;

    -- Create extension for UUID generation
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";

    -- Grant permissions
    GRANT ALL PRIVILEGES ON DATABASE meteorological_db TO wind_power_user;
    GRANT ALL PRIVILEGES ON DATABASE scada_db TO wind_power_user;
    GRANT ALL PRIVILEGES ON DATABASE power_prediction_db TO wind_power_user;
    GRANT ALL PRIVILEGES ON DATABASE report_db TO wind_power_user;
    GRANT ALL PRIVILEGES ON DATABASE tenant_db TO wind_power_user;
    GRANT ALL PRIVILEGES ON DATABASE wind_farm_db TO wind_power_user;