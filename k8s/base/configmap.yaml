apiVersion: v1
kind: ConfigMap
metadata:
  name: wind-power-config
  namespace: wind-power
data:
  # Database configuration
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "wind_power"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # RabbitMQ configuration
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  RABBITMQ_VHOST: "/"

  # JWT configuration
  JWT_ISSUER: "wind-power-system"
  JWT_AUDIENCE: "wind-power-users"
  JWT_EXPIRES_IN: "24h"

  # Application configuration
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  METRICS_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"

  # Service-specific configurations
  METEOROLOGICAL_SERVICE_URL: "http://meteorological-service:8001"
  SCADA_SERVICE_URL: "http://scada-service:8002"
  POWER_PREDICTION_SERVICE_URL: "http://power-prediction-service:8003"
  REPORT_SERVICE_URL: "http://report-service:8004"
  TENANT_SERVICE_URL: "http://tenant-service:8007"
  WIND_FARM_SERVICE_URL: "http://wind-farm-service:8006"

  # API Gateway configuration
  KONG_ADMIN_URL: "http://api-gateway:8001"
  KONG_PROXY_URL: "http://api-gateway:8000"

  # Feature flags
  ENABLE_RATE_LIMITING: "true"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"

  # Security settings
  CORS_ORIGIN: "*"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_HEADERS: "Content-Type,Authorization,X-Requested-With"