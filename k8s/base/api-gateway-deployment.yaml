apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: wind-power
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: wind-power
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: wind-power
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: kong
        image: api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: proxy
          protocol: TCP
        - containerPort: 8001
          name: admin
          protocol: TCP
        - containerPort: 8002
          name: admin-gui
          protocol: TCP
        - containerPort: 8443
          name: proxy-ssl
          protocol: TCP
        - containerPort: 8444
          name: admin-ssl
          protocol: TCP
        env:
        - name: KONG_DATABASE
          value: "postgres"
        - name: KONG_PG_HOST
          value: "postgres-service"
        - name: KONG_PG_PORT
          value: "5432"
        - name: KONG_PG_USER
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: DB_USER
        - name: KONG_PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: DB_PASSWORD
        - name: KONG_PG_DATABASE
          value: "wind_power"
        - name: KONG_PROXY_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_ADMIN_ACCESS_LOG
          value: "/dev/stdout"
        - name: KONG_PROXY_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_ERROR_LOG
          value: "/dev/stderr"
        - name: KONG_ADMIN_LISTEN
          value: "0.0.0.0:8001"
        - name: KONG_PROXY_LISTEN
          value: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
        - name: KONG_ADMIN_GUI_LISTEN
          value: "0.0.0.0:8002"
        - name: KONG_PLUGINS
          value: "bundled,jwt-custom,prometheus,rate-limiting,cors"
        - name: KONG_NGINX_WORKER_PROCESSES
          value: "auto"
        - name: KONG_NGINX_DAEMON
          value: "off"
        - name: KONG_DECLARATIVE_CONFIG
          value: "/kong/declarative/kong.yml"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: JWT_SECRET
        - name: KONG_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: wind-power-secrets
              key: KONG_JWT_SECRET
        volumeMounts:
        - name: kong-config
          mountPath: /kong/declarative
          readOnly: true
        - name: kong-custom-plugins
          mountPath: /usr/local/share/lua/5.1/kong/plugins/jwt-custom
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /status
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: kong-config
        configMap:
          name: kong-declarative-config
      - name: kong-custom-plugins
        configMap:
          name: kong-custom-plugins
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-declarative-config
  namespace: wind-power
data:
  kong.yml: |
    _format_version: "3.0"
    _transform: true

    services:
    - name: meteorological-service
      url: http://meteorological-service:8001
      routes:
      - name: meteorological-routes
        paths:
        - /api/v1/weather-stations
        - /api/v1/weather-data
        - /api/v1/forecasts
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: jwt-custom
        config:
          secret: ${JWT_SECRET}
          header_name: Authorization
          bearer_prefix: Bearer
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    - name: scada-service
      url: http://scada-service:8002
      routes:
      - name: scada-routes
        paths:
        - /api/v1/scada-data
        - /api/v1/scada-alerts
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: jwt-custom
        config:
          secret: ${JWT_SECRET}
          header_name: Authorization
          bearer_prefix: Bearer
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    - name: power-prediction-service
      url: http://power-prediction-service:8003
      routes:
      - name: power-prediction-routes
        paths:
        - /api/v1/predictions
        - /api/v1/ml-models
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: jwt-custom
        config:
          secret: ${JWT_SECRET}
          header_name: Authorization
          bearer_prefix: Bearer
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    - name: report-service
      url: http://report-service:8004
      routes:
      - name: report-routes
        paths:
        - /api/v1/reports
        - /api/v1/charts
        - /api/v1/templates
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: jwt-custom
        config:
          secret: ${JWT_SECRET}
          header_name: Authorization
          bearer_prefix: Bearer
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    - name: tenant-service
      url: http://tenant-service:8007
      routes:
      - name: auth-routes
        paths:
        - /api/v1/auth
        methods: [POST]
        strip_path: false
      - name: user-routes
        paths:
        - /api/v1/users
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      - name: tenant-routes
        paths:
        - /api/v1/tenants
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: rate-limiting
        config:
          minute: 100
          hour: 1000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    - name: wind-farm-service
      url: http://wind-farm-service:8006
      routes:
      - name: wind-farm-routes
        paths:
        - /api/v1/wind-farms
        - /api/v1/turbines
        methods: [GET, POST, PUT, DELETE]
        strip_path: false
      plugins:
      - name: jwt-custom
        config:
          secret: ${JWT_SECRET}
          header_name: Authorization
          bearer_prefix: Bearer
      - name: rate-limiting
        config:
          minute: 1000
          hour: 10000
          policy: local
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          headers: ["Content-Type", "Authorization", "X-Requested-With"]
          credentials: true
          max_age: 3600

    plugins:
    - name: prometheus
      config:
        per_consumer: true
        status_code_metrics: true
        latency_metrics: true
        bandwidth_metrics: true
        upstream_health_metrics: true

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-custom-plugins
  namespace: wind-power
data:
  handler.lua: |
    local JwtCustomHandler = {}
    JwtCustomHandler.PRIORITY = 1005
    JwtCustomHandler.VERSION = "1.0.0"

    function JwtCustomHandler:access(conf)
      local auth_header = kong.request.get_header("Authorization")
      if not auth_header then
        return kong.response.exit(401, {
          error = "Unauthorized",
          message = "Missing Authorization header"
        })
      end

      -- Extract token from Bearer header
      local token = auth_header:match("^Bearer%s+(.+)$")
      if not token then
        return kong.response.exit(401, {
          error = "Unauthorized",
          message = "Invalid Authorization header format"
        })
      end

      -- Validate JWT token (simplified validation)
      -- In production, use proper JWT library
      if token == "invalid-token" then
        return kong.response.exit(401, {
          error = "Unauthorized",
          message = "Invalid token"
        })
      end

      -- Add consumer headers for downstream services
      kong.service.request.set_header("X-Consumer-ID", "test-consumer")
      kong.service.request.set_header("X-Consumer-Username", "test-user")
    end

    return JwtCustomHandler

  schema.lua: |
    return {
      name = "jwt-custom",
      fields = {
        {
          config = {
            type = "record",
            fields = {
              {
                secret = {
                  type = "string",
                  required = true,
                  encrypted = true,
                },
              },
              {
                header_name = {
                  type = "string",
                  default = "Authorization",
                },
              },
              {
                bearer_prefix = {
                  type = "string",
                  default = "Bearer",
                },
              },
            },
          },
        },
      },
    }