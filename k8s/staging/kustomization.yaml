apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wind-power-staging

resources:
  - ../base

namePrefix: staging-
nameSuffix: -staging

commonLabels:
  environment: staging
  version: staging

patchesStrategicMerge:
  - deployment-patch.yaml
  - service-patch.yaml
  - ingress-patch.yaml

configMapGenerator:
  - name: staging-config
    literals:
      - NODE_ENV=staging
      - LOG_LEVEL=debug
      - METRICS_ENABLED=true
      - ENABLE_TRACING=true

secretGenerator:
  - name: staging-secrets
    literals:
      - DB_PASSWORD=staging-db-password
      - JWT_SECRET=staging-jwt-secret-key
    type: Opaque

images:
  - name: api-gateway
    newTag: staging
  - name: meteorological-service
    newTag: staging
  - name: scada-service
    newTag: staging
  - name: power-prediction-service
    newTag: staging
  - name: report-service
    newTag: staging
  - name: tenant-service
    newTag: staging
  - name: wind-farm-service
    newTag: staging

replicas:
  - name: api-gateway
    count: 2
  - name: meteorological-service
    count: 2
  - name: scada-service
    count: 2
  - name: power-prediction-service
    count: 2
  - name: report-service
    count: 2
  - name: tenant-service
    count: 2
  - name: wind-farm-service
    count: 2