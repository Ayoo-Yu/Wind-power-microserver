apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wind-power-ingress
  annotations:
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
spec:
  tls:
  - hosts:
    - staging-api.windpower.com
    secretName: staging-wind-power-tls-secret
  rules:
  - host: staging-api.windpower.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80