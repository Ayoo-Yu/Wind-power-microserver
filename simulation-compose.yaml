# ============================================================
# Simulation Infrastructure (妯℃嫙鍩虹璁炬柦)
# 浠呭寘鍚ā鎷熺敓浜х幆澧冩墍闇€鐨勬湇鍔★紝鍓嶅悗绔娇鐢ㄦ湰鍦板紑鍙戞ā寮?#
# 鍓嶅悗绔湰鍦板惎鍔?
#   cd wind-power-forecast/backend && python app.py          (:5000)
#   cd wind-power-forecast/backend-autopredict && python app.py (:5001)
#   cd wind-power-forecast/frontend && npm run serve         (:8080)
#
# 妯℃嫙鐜鍚姩:
#   docker compose -f simulation-compose.yaml up -d
# ============================================================

services:
  # ==========================================================
  # ZONE 3 - 涓浆鏈嶅姟锛堜粠鑵捐浜戞媺鍙朎-text锛?  # ==========================================================
  zone3-relay:
    build:
      context: .
      dockerfile: simulation/zone3-relay/Dockerfile
    image: sim-zone3-relay:v1
    container_name: sim-zone3-relay
    environment:
      - TZ=Asia/Shanghai
      - FETCH_INTERVAL_MINUTES=${FETCH_INTERVAL_MINUTES:-15}
    volumes:
      - ./simulation/data/etext:/data/from_server_c
      - ./simulation/logs/zone3:/var/log
      - ./simulation/ssh/id_rsa:/home/ecs-user/.ssh/id_rsa
    networks:
      - sim-external
      - sim-zone-transfer
    restart: unless-stopped

  # ==========================================================
  # ZONE 2 - 鏁版嵁澶勭悊鍣紙E-text 鈫?CSV 鈫?棰勬祴杈撳叆锛?  # 杈撳嚭鍒板涓绘満鐩綍锛屾湰鍦?autopredict 鐩存帴璇诲彇
  # ==========================================================
  zone2-processor:
    build:
      context: .
      dockerfile: simulation/zone2-processor/Dockerfile
    image: sim-zone2-processor:v1
    container_name: sim-zone2-processor
    environment:
      - TZ=Asia/Shanghai
      - FETCH_INTERVAL_MINUTES=${FETCH_INTERVAL_MINUTES:-15}
      - DB_INGEST_ENABLED=${DB_INGEST_ENABLED:-true}
      - DB_HOST=sim-kingbase
      - DB_PORT=54321
      - DB_USER=${DB_USER:-system}
      - DB_PASSWORD=${DB_PASSWORD:-12345678ab}
      - DB_NAME=${DB_NAME:-windpower}
      - FARM_CODE=${FARM_CODE:-DEFAULT_FARM}
      - FARM_CODES=${FARM_CODES:-CF,BNJ,SDS,DPLZ,ZYX}
    volumes:
      # E-text杈撳叆锛堜笌Zone3鍏变韩锛?      - ./simulation/data/etext:/data/from_server_c
      # 棰勬祴杈撳叆杈撳嚭 鈫?鏈湴 autopredict 鐨?predict_inputs 鐩綍
      - ./wind-power-forecast/backend-autopredict/auto_scripts/scripts/short/predict_inputs:/data/daily_pre_csv/short
      - ./wind-power-forecast/backend-autopredict/auto_scripts/scripts/middle/predict_inputs:/data/daily_pre_csv/middle
      # 妯℃澘鏂囦欢
      - ./simulation/data/template:/data/daily_pre_csv/example:ro
      # 鏃ュ織
      - ./simulation/logs/zone2:/var/log
    networks:
      - sim-zone-transfer
      - sim-scada-net
    depends_on:
      zone3-relay:
        condition: service_started
      kingbase:
        condition: service_healthy
    restart: unless-stopped

  # ==========================================================
  # SCADA 妯℃嫙鍣紙IEC 60870-5-104 Server锛?  # ==========================================================
  scada-simulator:
    build:
      context: .
      dockerfile: simulation/scada-simulator/Dockerfile
    image: sim-scada-simulator:v1
    container_name: sim-scada-server
    environment:
      - TZ=Asia/Shanghai
      - SIMULATOR_PORT=2404
      - POWER_MIN=${POWER_MIN:-0}
      - POWER_MAX=${POWER_MAX:-200}
      - UPDATE_INTERVAL_SECONDS=${UPDATE_INTERVAL_SECONDS:-10}
    ports:
      - "2404:2404"
    networks:
      - sim-scada-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2404 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================
  # 澶氬満绔?SCADA 鍔熺巼妯℃嫙鍣紙鐩存帴 HTTP POST锛屾棤闇€ C104锛?  # ==========================================================
  scada_multifarm:
    build:
      context: .
      dockerfile: simulation/scada-simulator/Dockerfile.multifarm
    container_name: sim-multifarm-scada
    environment:
      - TZ=Asia/Shanghai
      - FARM_CODES=${FARM_CODES:-CF,BNJ,SDS,DPLZ,ZYX}
      - FARM_CAPACITIES=${FARM_CAPACITIES:-48.0,32.0,193.5,47.5,453.5}
      - BACKEND_URL=http://host.docker.internal:${MAIN_APP_PORT:-5000}
      - UPDATE_INTERVAL=60
    entrypoint: ["python3", "scada_multifarm.py"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - sim-scada-net

  # ==========================================================
  # KINGBASE锛堥噾浠撴暟鎹簱锛? 鍓嶅悗绔湰鍦板紑鍙戜篃闇€瑕佹鏈嶅姟
  # ==========================================================
  kingbase:
    image: kingbase_v009r001c002b0014_single_x86:v1
    container_name: sim-kingbase
    privileged: true
    environment:
      - NEED_START=yes
      - DB_USER=${DB_USER:-system}
      - DB_PASSWORD=${DB_PASSWORD:-12345678ab}
      - DB_MODE=oracle
      - ENCODING=UTF8
      - TZ=Asia/Shanghai
    volumes:
      - sim_kingbase_data:/home/kingbase/userdata/
    ports:
      - "15432:54321"
    command: /usr/sbin/init
    restart: unless-stopped
    networks:
      - sim-zone-transfer
    healthcheck:
      test: ["CMD", "ls", "/home/kingbase/userdata/data"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ==========================================================
  # ==========================================================
  sim_kingbase_data:

networks:
  sim-external:
    name: sim-external
    driver: bridge
  sim-zone-transfer:
    name: sim-zone-transfer
    driver: bridge
  sim-scada-net:
    name: sim-scada-net
    driver: bridge
